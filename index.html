<style>
/* Layout: a navy masthead band (emblem, title, byline, section tabs resting on a gold rule) over a light
   reading room — filter chips, date and case strips, then a two-pane docket: entries on the left,
   a case-note reader on the right (an overlay on phones). A slim navy footer closes the page. */
:root {
  /* palette — journal navy and cool neutral greys; mist gold only for brand marks and featured items */
  --band: #142D43;            /* masthead, footer, primary buttons, selected state */
  --band-hover: #203E56;
  --band-ink: #FFFFFF;
  --band-muted: #CBD5DF;      /* secondary text on the band */
  --band-line: rgba(203, 213, 223, 0.18);
  --band-edge: #0C1E2E;       /* hairline under the masthead and above the footer */
  --band-badge: #263F55;      /* unread counts in the tabs */
  --band-badge-ink: #E7EDF3;
  --paper: #F6F7F8;           /* page */
  --surface: #FFFFFF;         /* cards, search box, reading pane */
  --surface-2: #EDF1F4;       /* secondary blocks */
  --hover: #F0F4F7;           /* card and control hover */
  --heading: #142D43;         /* titles */
  --ink: #253340;             /* body text */
  --muted: #536271;           /* dates, authors, case numbers */
  --faint: #536271;
  --line: #DCE2E7;            /* dividers and decorative borders */
  --line-strong: #7D8B99;     /* control borders, 3:1 or better */
  --line-hover: #6E7C8A;      /* card border on hover */
  --link: #245B83;
  --link-hover: #1A4566;
  --accent: #142D43;          /* selected filters, primary buttons */
  --accent-hover: #203E56;
  --accent-ink: #FFFFFF;
  --accent-soft: #EDF1F4;
  --focus: #2B78BD;           /* keyboard focus ring, distinct from the selected navy */
  --focus-band: #8CC4F2;      /* focus ring on the masthead */
  --code: #3A5068;            /* court and source codes */
  --tag-bg: #EEF1F4;          /* data type tags */
  --tag-ink: #45525E;
  --field-bg: #E3EBF3;        /* field tags (商務仲裁／投資仲裁) */
  --field-ink: #142D43;
  --disabled: #7E8A96;
  --charcoal: #142D43;        /* sub-headings */
  --gold: #B49A65;            /* mist gold: brand decoration */
  --gold-ink: #78602F;        /* gold text on light grounds */
  --gold-soft: #F4EEDF;       /* featured tag background */
  --note: #EDF1F4;
  --note-line: #DCE2E7;
  --note-ink: #253340;
  --tint-pil: #EDF1F4;
  --tint-pil-line: #DCE2E7;
  --tint-arb: #EDF1F4;
  --tint-arb-line: #DCE2E7;
  --ok: #2E6B45;              /* semantic text colours, always paired with an icon or words */
  --warn: #8A5A12;
  --err: #A6372E;
  --ok-bg: #2E6B45;           /* semantic toasts carry white text */
  --err-bg: #A6372E;
  --shadow: 0 1px 2px rgba(20, 45, 67, 0.04);
  --shadow-hover: 0 1px 2px rgba(20, 45, 67, 0.04);
  /* type — serif for headings, sans for reading, tabular figures for dates and counts */
  --f-display: "Playfair Display", "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
  --f-body: "Source Sans 3", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "Source Sans 3", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --s-xs: 14px; --s-sm: 15px; --s-md: 17px; --s-lg: 20px; --s-xl: 27px; --s-xxl: 32px;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band: #0D1B28; --band-hover: #1A3044; --band-ink: #FFFFFF; --band-muted: #C3CEDA; --band-line: rgba(195, 206, 218, 0.16);
    --band-edge: #060E16; --band-badge: #22384C; --band-badge-ink: #E7EDF3;
    --paper: #0F1923; --surface: #16222D; --surface-2: #1C2A36; --hover: #1E2D3A;
    --heading: #EEF3F7; --ink: #DDE4EA; --muted: #A8B5C1; --faint: #A8B5C1;
    --line: #2A3A48; --line-strong: #6F8090; --line-hover: #8796A4;
    --link: #8EC1EA; --link-hover: #B5D6F2;
    --accent: #4A7BA4; --accent-hover: #426F96; --accent-ink: #FFFFFF; --accent-soft: #1C2A36;
    --focus: #7DB7EA; --focus-band: #8CC4F2;
    --code: #B7C6D4; --tag-bg: #22303C; --tag-ink: #C9D3DC; --field-bg: #213548; --field-ink: #DCE7F1; --disabled: #6E7C89;
    --charcoal: #EEF3F7; --gold: #C2A774; --gold-ink: #D9C18E; --gold-soft: #2B2519;
    --note: #1C2A36; --note-line: #2A3A48; --note-ink: #DDE4EA;
    --tint-pil: #1C2A36; --tint-pil-line: #2A3A48; --tint-arb: #1C2A36; --tint-arb-line: #2A3A48;
    --ok: #7FC497; --warn: #E0B35E; --err: #F08A80; --ok-bg: #2E6B45; --err-bg: #A6372E;
    --shadow: none; --shadow-hover: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band: #0D1B28; --band-hover: #1A3044; --band-ink: #FFFFFF; --band-muted: #C3CEDA; --band-line: rgba(195, 206, 218, 0.16);
  --band-edge: #060E16; --band-badge: #22384C; --band-badge-ink: #E7EDF3;
  --paper: #0F1923; --surface: #16222D; --surface-2: #1C2A36; --hover: #1E2D3A;
  --heading: #EEF3F7; --ink: #DDE4EA; --muted: #A8B5C1; --faint: #A8B5C1;
  --line: #2A3A48; --line-strong: #6F8090; --line-hover: #8796A4;
  --link: #8EC1EA; --link-hover: #B5D6F2;
  --accent: #4A7BA4; --accent-hover: #426F96; --accent-ink: #FFFFFF; --accent-soft: #1C2A36;
  --focus: #7DB7EA; --focus-band: #8CC4F2;
  --code: #B7C6D4; --tag-bg: #22303C; --tag-ink: #C9D3DC; --field-bg: #213548; --field-ink: #DCE7F1; --disabled: #6E7C89;
  --charcoal: #EEF3F7; --gold: #C2A774; --gold-ink: #D9C18E; --gold-soft: #2B2519;
  --note: #1C2A36; --note-line: #2A3A48; --note-ink: #DDE4EA;
  --tint-pil: #1C2A36; --tint-pil-line: #2A3A48; --tint-arb: #1C2A36; --tint-arb-line: #2A3A48;
  --ok: #7FC497; --warn: #E0B35E; --err: #F08A80; --ok-bg: #2E6B45; --err-bg: #A6372E;
  --shadow: none; --shadow-hover: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--s-md);
  line-height: 1.7;
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
/* paints the phone's status-bar strip in the masthead colour */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap {
  max-width: 1352px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { display: grid; gap: 0; padding-block: var(--gap-lg) 72px; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--link); text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { color: var(--link-hover); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums lining-nums; }
h1, h2, h3, .sec-tab, .day-head .d, .r-title, .dg-title { font-variant-numeric: lining-nums; }

/* court and source codes share one deep blue-grey */
:root, [data-court] { --cc: var(--code); }

/* rhythm: 48–64px between blocks, 20–28px inside them; the slim navigation row is the only fixed element */
:root { --nav-row: 52px; --gap-xl: 56px; --gap-lg: 40px; --gap-md: 24px; --radius-sm: 3px; }
@media (max-width: 760px) { :root { --nav-row: 48px; --gap-xl: 40px; --gap-lg: 32px; --gap-md: 20px; } }
html { scroll-padding-top: calc(var(--nav-h, 54px) + 12px); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* header, tier 1: emblem, site name and update status — scrolls away with the page */
.mast { position: relative; overflow: hidden; background: var(--band); color: var(--band-ink); }
.mast-art { position: absolute; right: -110px; top: -200px; width: 560px; height: 560px; color: var(--gold); opacity: 0.14; pointer-events: none; }
.mast-art.is-parallax { will-change: transform; }
.mast-inner { position: relative; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 40px; padding-block: 26px 24px; }
.brand { display: flex; align-items: center; gap: 16px; min-width: 0; }
.brand > div { min-width: 0; }
.emblem { flex: 0 0 auto; width: 50px; height: 50px; color: var(--gold); }
.eyebrow { font-family: var(--f-body); font-weight: 600; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--band-muted); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.2; margin: 3px 0 0; letter-spacing: 0.08em; text-wrap: balance; color: var(--band-ink); }
.status { font-size: var(--s-xs); color: var(--band-muted); display: flex; flex-wrap: wrap; gap: 2px 18px; max-width: 560px; }
.status b { color: var(--band-ink); font-weight: 600; }
.mast :focus-visible, .navbar :focus-visible { outline-color: var(--focus-band); }

/* header, tier 2: 首頁／國際公法／國際仲裁法／本週重點 and search — stays at the top while scrolling */
.navbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--band); border-top: 1px solid var(--band-line); border-bottom: 1px solid var(--band-edge); }
.nav-inner { display: flex; align-items: center; gap: 0 24px; min-height: var(--nav-row); }
.sections { flex: 1 1 auto; min-width: 0; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
.sections::-webkit-scrollbar { display: none; }
.sec-tab {
  flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px; height: var(--nav-row);
  border: 0; background: none; cursor: pointer; padding: 3px 14px 0; border-bottom: 3px solid transparent; color: var(--band-muted);
  font-family: var(--f-body); font-weight: 600; font-size: 16px; line-height: 1.3; letter-spacing: 0.04em;
}
.sec-tab:first-child { padding-left: 0; }
.sec-tab .en { display: none; }
.sec-tab .n { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 12px; letter-spacing: 0; line-height: 1.6; color: var(--band-badge-ink); background: var(--band-badge); border-radius: 999px; padding: 0 7px; }
.sec-tab:hover { color: var(--band-ink); }
.sec-tab[aria-selected="true"] { color: var(--band-ink); border-bottom-color: var(--gold); }
.sec-tab:focus-visible { outline-offset: -4px; }
.nav-search { flex: 0 1 320px; min-width: 0; margin: 0; }
.search { position: relative; }
.search-ico { position: absolute; left: 11px; top: 50%; width: 16px; height: 16px; transform: translateY(-50%); color: var(--band-muted); pointer-events: none; }
.nav-search input {
  width: 100%; height: 36px; border: 1px solid #6F8397; border-radius: var(--radius); background: rgba(255, 255, 255, 0.06); color: var(--band-ink);
  padding: 0 12px 0 34px; font-size: var(--s-sm);
}
.nav-search input::placeholder { color: var(--band-muted); opacity: 1; }
.nav-search input:hover { border-color: var(--band-muted); }
.nav-search input:focus { border-color: var(--focus-band); background: rgba(255, 255, 255, 0.1); }
.nav-search-btn { display: none; }
@media (max-width: 760px) {
  .nav-inner { flex-wrap: wrap; gap: 0 6px; }
  .nav-search { display: none; order: 2; flex: 1 0 100%; padding-bottom: 10px; }
  .navbar.is-searching .nav-search { display: block; }
  .nav-search input { height: 40px; font-size: 16px; }
  .nav-search-btn {
    order: 1; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 40px; height: 40px;
    border: 1px solid transparent; border-radius: var(--radius); background: none; color: var(--band-ink); cursor: pointer;
  }
  .nav-search-btn svg { width: 19px; height: 19px; }
  .nav-search-btn[aria-expanded="true"] { background: rgba(255, 255, 255, 0.1); border-color: #6F8397; }
  .sections { gap: 0; }
  .sec-tab { font-size: 15px; padding-inline: 8px; gap: 5px; }
  .sec-tab .n { padding: 0 5px; font-size: 11px; }
}
@media (max-width: 760px) { .sections { flex: 1 1 0; } }
.sec-tab .short { display: none; }
@media (max-width: 600px) { .sec-tab .full { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; } .sec-tab .short { display: inline; } }
@media (max-width: 440px) { .sec-tab .n { display: none; } }
@media (max-width: 400px) { .sec-tab { padding-inline: 4px; letter-spacing: 0; font-size: 14px; } }

/* filters: under the section heading, one quiet band closed by a hairline */
.zone-filters { border-bottom: 1px solid var(--line); }
.zone-filters .zone-inner { padding-block: 14px 18px; }
.fbar { display: grid; gap: 14px; }
.ftop { display: none; }
.ftoggle { display: none; align-items: center; gap: 6px; flex: 0 0 auto; min-height: 36px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 6px 14px; font-size: var(--s-sm); font-weight: 600; cursor: pointer; }
.ftoggle:hover { background: var(--hover); border-color: var(--line-hover); }
.fpanel { display: grid; gap: 12px; }
.frow { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fgroup { display: flex; align-items: center; gap: 10px; min-width: 0; }
.flabel { flex: 0 0 auto; font-size: var(--s-xs); font-weight: 600; color: var(--muted); }
.fopts { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.fpill { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 13px; font-size: var(--s-sm); color: var(--ink); cursor: pointer; white-space: nowrap; }
.fpill .n { font-variant-numeric: tabular-nums; font-size: var(--s-xs); color: var(--faint); }
.fpill:hover { border-color: var(--line-hover); background: var(--hover); }
.fpill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fpill[aria-pressed="true"] .n { color: var(--accent-ink); }
.fpill[aria-pressed="true"]:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.fpill:disabled, .fpill:disabled:hover { color: var(--disabled); border-color: var(--line); background: var(--paper); cursor: default; }
.fpill:disabled .n { color: var(--disabled); }
.adv { border-top: 1px solid var(--line); padding-top: 10px; }
.adv summary { cursor: pointer; font-size: var(--s-sm); font-weight: 600; color: var(--link); width: max-content; }
.adv-body { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-top: 12px; }
.fsel { display: inline-flex; align-items: center; gap: 8px; font-size: var(--s-xs); font-weight: 600; color: var(--muted); }
.fsel select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 6px 10px; font-size: var(--s-sm); font-weight: 400; color: var(--ink); max-width: 15em; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--s-sm); color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.linkish:hover { color: var(--link-hover); }
.linkish { border: 0; background: none; padding: 0; font-size: var(--s-sm); color: var(--link); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; text-align: left; }
.active { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.chips-label { font-size: var(--s-xs); color: var(--muted); margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface-2); color: var(--heading); border-radius: 999px; padding: 2px 6px 2px 12px; font-size: var(--s-sm); font-weight: 600; cursor: pointer; }
.chip .x { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 15px; line-height: 1; }
.chip:hover .x { background: var(--accent); color: var(--accent-ink); }
.result { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: var(--s-xs); color: var(--muted); }
.result b { color: var(--ink); font-size: var(--s-sm); }
.result .linkish { font-size: var(--s-xs); }
@media (max-width: 760px) {
  .ftop { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .ftoggle { display: inline-flex; }
  .fpanel { display: none; }
  .fbar.is-open .fpanel { display: grid; }
  .fgroup { display: grid; gap: 6px; width: 100%; }
}

/* sidebar: 案件追蹤 first, then 即將到來, then 關鍵字雲 — separated by rules, not boxes; smaller headings than the list */
.side { display: grid; gap: var(--gap-md); align-content: start; min-width: 0; }
.side-box { border-top: 1px solid var(--line-strong); }
.side-box > summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 12px 0 10px; cursor: pointer; list-style: none; }
.side-box > summary::-webkit-details-marker { display: none; }
.side-box > summary:hover .side-h { color: var(--link); }
.side-box > summary::after { content: "＋"; color: var(--muted); font-size: var(--s-sm); }
.side-box[open] > summary::after { content: "－"; }
.side-h { font-family: var(--f-body); font-weight: 700; font-size: 15px; letter-spacing: 0.08em; color: var(--heading); }
.side-n { margin-left: auto; font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.side-list { list-style: none; margin: 0; padding: 0 0 6px; display: grid; }
.si { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; padding: 12px 0; border-top: 1px solid var(--line); }
.si:first-child { border-top: 0; padding-top: 4px; }
.si-date { display: grid; align-content: start; line-height: 1.3; font-variant-numeric: lining-nums tabular-nums; }
.si-date b { font-size: var(--s-md); color: var(--heading); }
.si-date span { font-size: var(--s-xs); color: var(--muted); }
.si-date.soon b { text-decoration: underline; text-decoration-color: var(--line-strong); text-underline-offset: 4px; }
.si-main { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.si-meta { font-size: var(--s-xs); color: var(--muted); }
.si-meta .code { color: var(--cc); font-weight: 600; letter-spacing: 0.03em; }
.si-title { font-size: var(--s-sm); font-weight: 500; line-height: 1.5; color: var(--ink); text-align: left; text-decoration: none; border: 0; background: none; padding: 0; cursor: pointer; }
span.si-title { cursor: default; }
a.si-title:hover, button.si-title:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.si-note { font-size: var(--s-xs); color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.si-case { grid-template-columns: minmax(0, 1fr); }
.si-btn { display: grid; gap: 3px; width: 100%; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); cursor: pointer; }
.si-btn:hover .si-title { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.si-case.is-open .si-title { color: var(--heading); font-weight: 700; }
.si-case.is-open { box-shadow: inset 3px 0 0 var(--gold); padding-left: 12px; }
.si-more { display: block; padding: 10px 0 4px; border-top: 1px solid var(--line); }
.side-foot { padding: 2px 0 10px; }
.ag-cal { font-size: var(--s-xs); color: var(--link); text-decoration: none; white-space: nowrap; font-weight: 600; }
.ag-cal:hover { text-decoration: underline; }

/* layout: list with the sidebar beside it (below it on narrower screens); an opened entry takes the
   sidebar's place at about 35% list / 65% article, or a full-screen reading view below 1024px */
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--gap-lg); align-items: start; }
@media (min-width: 1060px) { .split { grid-template-columns: minmax(0, 1fr) 320px; gap: var(--gap-xl); } }
body[data-sec="home"] .split, body[data-sec="week"] .split { grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1024px) {
  body.reading .split { grid-template-columns: minmax(0, 35fr) minmax(0, 65fr); gap: 32px; }
  body.reading .split > .side { display: none; }
}

/* list: short title and one key point per entry, divided by hairlines */
.list { display: grid; gap: 36px; min-width: 0; align-content: start; }
.day { display: grid; gap: 2px; min-width: 0; }
.day-items { display: grid; grid-template-columns: minmax(0, 1fr); }
.day-head { display: flex; align-items: baseline; gap: 12px; padding-bottom: 4px; }
.day-head .d { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; color: var(--heading); }
.day-head .iso { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: var(--s-xs); color: var(--muted); letter-spacing: 0.02em; }
.day-head .rule { flex: 1; border-top: 1px solid var(--line-strong); transform: translateY(-4px); }

.row {
  display: grid; gap: 5px; width: 100%; text-align: left; cursor: pointer;
  background: none; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; padding: 15px 12px 16px;
}
.row:hover { background: var(--hover); }
.row[aria-current="true"] { background: var(--hover); box-shadow: inset 3px 0 0 var(--gold); }
.row:focus-visible { outline-offset: -2px; }
.row-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: var(--s-xs); color: var(--muted); }
.row .code { font-family: var(--f-mono); font-weight: 700; letter-spacing: 0.03em; color: var(--cc); }
.kind { background: var(--tag-bg); color: var(--tag-ink); border-radius: var(--radius-sm); padding: 0 7px; line-height: 1.6; font-weight: 500; }
.key { background: var(--gold-soft); color: var(--gold-ink); font-weight: 700; border-radius: var(--radius-sm); padding: 0 7px; line-height: 1.6; }
.fld { background: var(--field-bg); color: var(--field-ink); font-weight: 600; border-radius: var(--radius-sm); padding: 0 7px; line-height: 1.6; }
.row-ev { color: var(--ink); }
.unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--link); display: inline-block; }
.starred { color: var(--gold-ink); }
.row-title { font-weight: 500; font-size: 18px; line-height: 1.45; color: var(--heading); }
.row.is-read .row-title { font-weight: 400; }
.row-point { font-size: var(--s-sm); color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-sub { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: var(--s-xs); color: var(--muted); }
.case-tag { color: var(--heading); font-weight: 600; }

.empty { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 24px 20px; color: var(--muted); font-size: var(--s-sm); background: var(--surface); }
.empty.is-error { border-color: var(--err); }
.empty.is-error strong { color: var(--err); }
.empty strong { color: var(--ink); display: block; font-size: var(--s-md); margin-bottom: 4px; font-weight: 600; }

/* reader: one white page; the text keeps a 680–760px measure and a sticky bar holds the way back */
.reader {
  display: none; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
@media (min-width: 1024px) {
  body.reading .reader {
    display: block; position: sticky; top: calc(var(--nav-h, 54px) + 16px);
    max-height: calc(100dvh - var(--nav-h, 54px) - 32px); overflow-y: auto; overscroll-behavior: contain;
  }
}
@media (max-width: 1023.98px) {
  body.reading { overflow: hidden; }
  body.reading .reader {
    display: block; position: fixed; inset: 0; z-index: 20; border: 0; border-radius: 0;
    overflow-y: auto; overscroll-behavior: contain;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
}
.r-bar {
  position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 14px;
  padding: 12px 40px; background: var(--surface); border-bottom: 1px solid var(--line);
}
.r-bar-label { min-width: 0; font-size: var(--s-xs); color: var(--muted); letter-spacing: 0.04em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.r-wrap { padding: 28px 40px 44px; display: grid; gap: 32px; justify-items: start; }
.r-wrap > * { width: 100%; max-width: 720px; min-width: 0; }
@media (max-width: 1023.98px) {
  .r-bar { padding: 10px max(16px, calc((100% - 720px) / 2)); }
  .r-wrap { padding: 22px 20px 44px; justify-items: center; }
}
@media (max-width: 520px) { .r-wrap { padding-inline: 16px; gap: 28px; } }
.back {
  display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; min-height: 34px;
  border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius);
  padding: 4px 14px; font-size: var(--s-sm); font-weight: 600; color: var(--heading); cursor: pointer;
}
.back:hover { background: var(--hover); border-color: var(--line-hover); }
.back .d { display: none; }
@media (min-width: 1024px) { .back .m { display: none; } .back .d { display: inline; } }

.r-head { display: grid; gap: 14px; }
.r-kicker { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font-size: var(--s-xs); color: var(--muted); }
.r-kicker .code { font-family: var(--f-mono); font-weight: 700; letter-spacing: 0.03em; color: var(--code); }
.r-title { font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.45; letter-spacing: 0.02em; margin: 0; text-wrap: pretty; color: var(--heading); }
.r-orig { margin: -4px 0 0; font-family: var(--f-body); color: var(--muted); font-size: var(--s-sm); line-height: 1.6; overflow-wrap: anywhere; }
/* case number, author, institution and the three dates gathered in one pale panel */
.r-info { margin-top: 4px; background: var(--surface-2); border-radius: var(--radius); padding: 16px 20px; display: grid; gap: 12px; }
.r-info dl { margin: 0; display: grid; gap: 10px 28px; }
.r-facts { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.r-facts > div { display: grid; grid-template-columns: 5em minmax(0, 1fr); gap: 14px; align-items: baseline; }
.r-facts dd { margin: 0; }
.r-info dl > div { min-width: 0; }
.r-info dt { font-size: var(--s-xs); font-weight: 600; color: var(--muted); }
.r-info dd { margin: 1px 0 0; font-size: var(--s-sm); line-height: 1.55; color: var(--ink); overflow-wrap: anywhere; }
.r-info dd .linkish { font-size: inherit; }
.r-dates { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.r-facts + .r-dates { padding-top: 12px; border-top: 1px solid var(--line); }
.r-dates dd { font-weight: 600; font-variant-numeric: tabular-nums; }
.r-dates dd.na { font-weight: 400; color: var(--muted); }
@media (max-width: 560px) {
  .r-dates { grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .r-dates > div { display: grid; grid-template-columns: 7.5em minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .r-dates dd { margin: 0; }
  .r-info { padding: 14px 16px; }
}
@media (max-width: 640px) { .r-title { font-size: 23px; } }
.r-src { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.srcbtn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 18px; font-size: var(--s-sm); font-weight: 600; color: var(--heading); background: var(--surface); text-decoration: none; }
.srcbtn.primary { background: var(--accent); color: var(--accent-ink); }
.srcbtn:hover { background: var(--hover); color: var(--heading); }
.srcbtn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); color: var(--accent-ink); }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 34px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 4px 14px; font-size: var(--s-sm); color: var(--ink); cursor: pointer; text-align: left; }
.btn:hover { background: var(--hover); border-color: var(--line-hover); }
.btn[aria-pressed="true"] { border-color: var(--gold-ink); color: var(--gold-ink); background: var(--gold-soft); }

.r-sec { display: grid; gap: 14px; }
.r-sec h3 { margin: 0; font-family: var(--f-body); font-size: var(--s-xs); color: var(--faint); font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.r-sec h3 > span:not(.zh) { display: none; }
.r-sec h3 .zh { font-family: var(--f-display); letter-spacing: 0.06em; font-size: 19px; color: var(--heading); font-weight: 700; text-transform: none; }
.r-sec p { margin: 0; line-height: 1.85; }
.r-sec ul { margin: 0; padding-left: 1.3em; display: grid; gap: 10px; line-height: 1.85; }
.r-sec li::marker { color: var(--muted); }
.r-sec .lead-note { list-style: none; margin-left: -1.3em; color: var(--muted); font-size: var(--s-sm); }

/* the plain-language summary reads like an abstract: larger type behind a rule */
.tldr { border-left: 3px solid var(--heading); padding: 2px 0 2px 20px; }
.tldr p { font-size: 18px; line-height: 1.85; }

.note { background: var(--note); border-radius: var(--radius); padding: 16px 20px; color: var(--note-ink); }
.note h3, .note h3 .zh { color: var(--note-ink); }
.note p { font-size: var(--s-sm); }

.sources ul { list-style: none; padding: 0; gap: 10px; }
.src { display: grid; gap: 2px; }
.src a { font-size: var(--s-sm); line-height: 1.5; overflow-wrap: anywhere; }
.src .src-meta { display: flex; gap: 8px; align-items: center; font-size: var(--s-xs); color: var(--faint); font-family: var(--f-mono); }
.badge { font-family: var(--f-body); font-size: 13px; border-radius: var(--radius-sm); padding: 0 6px; line-height: 1.6; border: 1px solid var(--line-strong); color: var(--muted); }
.badge.off { border-color: var(--link); color: var(--link); }

.memo { border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; background: var(--surface); }
.memo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.memo p { font-size: var(--s-sm); line-height: 1.9; }
.btn-sm { min-height: 28px; padding: 2px 11px; font-size: var(--s-xs); }
.case-line { margin: 0; }
.mini-tl { list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 5px; }
.mini-tl .linkish { text-align: left; text-decoration: none; color: var(--ink); line-height: 1.5; }
.mini-tl .linkish:hover { color: var(--link); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px !important; border-left: 1px solid var(--line-strong); display: grid; gap: 16px; }
.timeline li { position: relative; display: grid; gap: 4px; }
.timeline li::before { content: ""; position: absolute; left: -24px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--cc); border: 2px solid var(--surface); }
.tl-date { font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-card { display: grid; gap: 3px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; border-radius: 0; padding: 4px 0 12px; cursor: pointer; }
.tl-card:hover .tl-title { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.tl-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: var(--s-xs); color: var(--muted); }
.tl-meta .code { font-family: var(--f-mono); color: var(--cc); font-weight: 600; letter-spacing: 0.03em; }
.tl-title { display: block; font-weight: 500; line-height: 1.5; color: var(--heading); }
.timeline li.is-comment .tl-title { font-weight: 400; }
.tl-tldr { font-size: var(--s-sm); color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.case-ahead { list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 6px; }
.case-ahead li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: var(--s-sm); }
.case-foot { font-size: var(--s-xs); color: var(--faint); margin: 0; }

/* keyword cloud (in the sidebar, closed until opened) */
.side-box .cloud { margin: 2px 0 8px; }
.cloud { position: relative; min-height: 96px; background: transparent; border: 0; border-radius: var(--radius); overflow: hidden; }
.cw {
  position: absolute; left: 0; top: 0; margin: 0; padding: 0 4px; border: 0; border-radius: 3px; background: none;
  font-family: var(--f-body); font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer;
  font-variant-numeric: lining-nums;
}
.cw.t1 { color: var(--heading); font-weight: 700; }
.cw.t2 { color: var(--link); font-weight: 700; }
.cw.t3 { color: var(--ink); }
.cw.t4 { color: var(--muted); }
.cw:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.cw[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.cloud-empty { margin: 0; padding: 30px 18px; text-align: center; color: var(--muted); font-size: var(--s-sm); }
.cloud-note { margin: 0; padding: 0 0 12px; font-size: var(--s-xs); color: var(--muted); line-height: 1.6; }
.digest .cloud { background: var(--paper); border: 1px solid var(--line); }

/* section heading and the home intro: type and space instead of a tinted band */
body { --tint: var(--tint-pil); --tint-line: var(--tint-pil-line); }
body[data-sec="arb"] { --tint: var(--tint-arb); --tint-line: var(--tint-arb-line); }
.zone-head .zone-inner { padding-block: 36px 6px; }
body[data-sec="home"] .zone-head .zone-inner { padding-block: 36px 0; }
.sec-intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 48px; }
.sec-name { margin: 2px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.25; letter-spacing: 0.08em; color: var(--heading); }
.sec-scope { margin: 0; max-width: 640px; font-size: var(--s-sm); line-height: 1.7; color: var(--muted); }
@media (max-width: 640px) {
  .zone-head .zone-inner { padding-block: 24px 2px; }
  body[data-sec="home"] .zone-head .zone-inner { padding-block: 24px 0; }
  .sec-name { font-size: 24px; }
  .sec-scope { display: none; }
  .zone-filters .zone-inner { padding-block: 10px 14px; }
}

/* print: one clean column on white — the open entry or case, the weekly issue, or the current list */
@media print {
  @page { size: A4; margin: 16mm 15mm 18mm; @bottom-right { content: counter(page) " / " counter(pages); font-size: 8pt; color: #555; } }
  html:root:not([data-never]) {
    color-scheme: light;
    --paper: #FFFFFF; --surface: #FFFFFF; --ink: #000000; --muted: #333333; --faint: #555555; --line: #BBBBBB; --line-strong: #999999;
    --accent: #142D43; --accent-ink: #FFFFFF; --accent-soft: #F1F3F5; --charcoal: #142D43; --gold: #9C8350; --gold-ink: #5E4B24;
    --heading: #142D43; --link: #1B4A6E; --code: #2E3F52; --surface-2: #F1F3F5; --hover: #FFFFFF; --line-hover: #999999;
    --tag-bg: #EEF1F4; --tag-ink: #333333; --field-bg: #E8EEF4; --field-ink: #142D43; --gold-soft: #F4EEDF;
    --note: #F1F3F5; --note-line: #BBBBBB; --note-ink: #000000; --tint: #FFFFFF; --tint-line: #BBBBBB;
    --shadow: none; --shadow-hover: none;
  }
  body { background: #FFFFFF; color: #000000; font-size: 10.5pt; line-height: 1.6; overflow: visible !important; }
  body::before { display: none; }
  .mast, .navbar, .r-bar, .zone, .side, .foot, .toast, .back, .r-actions, .r-src, .r-nav, .reader .tags, .memo-head .btn, .ag-cal, .dg-actions, .dg-kicker select,
  .hl-more, .dm-cta, .nx-more, .home-aside, .list > .btn, .unread-dot, .cloud, .digest .dg-sec:has(.cloud) { display: none !important; }
  .print-head { display: grid; gap: 2pt; margin-bottom: 12pt; padding-bottom: 6pt; border-bottom: 1.5pt solid #000000; font-size: 8.5pt; color: #333333; }
  .ph-top { display: flex; justify-content: space-between; gap: 12pt; }
  .ph-site { font-family: var(--f-display); font-weight: 700; font-size: 11pt; color: #000000; letter-spacing: 0.06em; }
  .ph-view { font-weight: 600; color: #000000; }
  .ph-url { overflow-wrap: anywhere; }
  .wrap, .app { max-width: none; padding: 0; }
  .app { gap: 0; }
  .split, body.reading .split { display: block; }
  body.reading .list { display: none; }
  body.reading .reader {
    display: block !important; position: static !important; inset: auto; max-height: none !important; overflow: visible !important;
    border: 0; border-radius: 0; box-shadow: none; padding: 0 !important;
  }
  .r-wrap { padding: 0; max-width: none; gap: 12pt; }
  .r-wrap > * { max-width: none; }
  .r-info { -webkit-print-color-adjust: exact; print-color-adjust: exact; break-inside: avoid; }
  .r-head { padding-bottom: 10pt; }
  .r-title { font-size: 17pt; }
  .r-sec h3 { break-after: avoid; }
  .r-sec p, .r-sec ul { max-width: none; }
  .tldr, .note, .memo, .r-info { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tldr, .note, .memo { break-inside: avoid; }
  .tldr p { font-size: 11pt; }
  a { color: #000000; text-decoration: none; }
  .src a::after { content: "　" attr(href); font-size: 8.5pt; color: #444444; overflow-wrap: anywhere; }
  .row, .tl-card, .dg-link, .hl-list, .dm-link, .ag, .digest, .reader { box-shadow: none !important; }
  .list { gap: 14pt; }
  .day-items, body.reading .day-items { display: block; }
  .day-head { break-after: avoid; }
  .row { break-inside: avoid; margin-bottom: 6pt; padding: 7pt 9pt; border: 0.75pt solid #BBBBBB; background: #FFFFFF !important; }
  .row-tldr, body.reading .row-tldr, .tl-tldr { -webkit-line-clamp: unset; display: block; overflow: visible; }
  .timeline li { break-inside: avoid; }
  .timeline li::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body .digest { border: 0; padding: 0; max-width: none; box-shadow: none; }
  body .dg-head { border-bottom: 1.5pt solid #000000; }
  .dg-link { break-inside: avoid; background: #FFFFFF; }
  .hl-list, .dm-list { display: block; }
  .hl, .dm { break-inside: avoid; border: 0 !important; border-top: 0.75pt solid #BBBBBB !important; }
  .hl-link, .dm-link { padding: 8pt 0 !important; }
}

/* home page: one reading path — intro, recent highlights, ways in, what's next */
.home-link { color: inherit; text-decoration: none; }
.home-link:hover { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 1px; text-underline-offset: 6px; }
body[data-sec="home"] .reader:empty { display: none; }
.portal-kicker { font-size: 12.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
.home-intro { display: grid; gap: 6px; }
.home-lede { margin: 0; max-width: 34em; font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.55; letter-spacing: 0.03em; color: var(--heading); }
.home-updated { margin: 0; font-size: var(--s-xs); color: var(--muted); font-variant-numeric: lining-nums tabular-nums; }
.home { display: grid; gap: var(--gap-xl); }
.hsec { display: grid; gap: 14px; min-width: 0; }
.hsec-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 24px; }
.hsec-title { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 23px; line-height: 1.3; letter-spacing: 0.06em; color: var(--heading); }
.hsec-note { margin: 0; font-size: var(--s-xs); line-height: 1.6; color: var(--muted); }
.home-wait { margin: 0; padding: 18px 0; font-size: var(--s-sm); color: var(--muted); }
.home-wait.is-error { color: var(--err); }
/* recent highlights: one lead on the left (about 60%), up to two below each other on the right (40%);
   a mist-gold rule marks the block as the editors' pick, hairlines divide the items */
.hl-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); border-top: 2px solid var(--gold); border-bottom: 1px solid var(--line); }
.hl { min-width: 0; }
.hl-link { display: flex; flex-direction: column; gap: 10px; height: 100%; color: var(--ink); text-decoration: none; }
.hl-link:hover { color: var(--ink); }
.hl-link:focus-visible { outline-offset: 4px; }
.hl-meta { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; font-size: var(--s-xs); color: var(--muted); }
.hl-sec { font-weight: 700; letter-spacing: 0.06em; color: var(--code); }
.hl-tag { background: var(--tag-bg); color: var(--tag-ink); border-radius: var(--radius-sm); padding: 0 7px; line-height: 1.6; }
.hl-title { margin: 0; font-family: var(--f-display); font-weight: 700; color: var(--heading); letter-spacing: 0.02em; text-wrap: pretty; }
.hl-blurb { margin: 0; color: var(--ink); display: -webkit-box; -webkit-box-orient: vertical; overflow: hidden; }
.hl-more { margin-top: auto; padding-top: 2px; font-size: var(--s-sm); font-weight: 600; color: var(--link); }
.hl-link:hover .hl-title { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.hl-link:hover .hl-more { color: var(--link-hover); }
.hl-lead .hl-link { padding: 28px 0 30px; }
.hl-lead .hl-title { font-size: 30px; line-height: 1.4; }
.hl-lead .hl-blurb { max-width: 36em; font-size: 18px; line-height: 1.85; -webkit-line-clamp: 3; }
.hl-lead .hl-more { margin-top: 6px; }
.hl-side .hl-link { padding: 22px 0 24px; }
.hl-side .hl-title { font-size: 20px; line-height: 1.5; }
.hl-side .hl-blurb { font-size: 16px; line-height: 1.75; -webkit-line-clamp: 2; }
.hl + .hl { border-top: 1px solid var(--line); }
@media (min-width: 900px) {
  .hl-list.n2, .hl-list.n3 { grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); }
  .hl-list.n3 .hl-lead { grid-row: span 2; }
  .hl-list.n2 .hl-lead, .hl-list.n3 .hl-lead { border-right: 1px solid var(--line); }
  .hl-list.n2 .hl-lead .hl-link, .hl-list.n3 .hl-lead .hl-link { padding-right: 40px; }
  .hl-list .hl-side { border-top: 0; }
  .hl-list .hl-side + .hl-side { border-top: 1px solid var(--line); }
  .hl-side .hl-link { padding-left: 36px; }
}
/* the two sections: name, one line of scope and an arrow link, divided by a hairline */
.dm-list { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); border-top: 1px solid var(--line-strong); }
.dm { min-width: 0; }
.dm:nth-child(even) { border-left: 1px solid var(--line); }
.dm:nth-child(n+3) { border-top: 1px solid var(--line); }
.dm-link { display: grid; gap: 8px; padding: 22px 36px 24px 0; color: var(--ink); text-decoration: none; }
.dm:nth-child(even) .dm-link { padding: 22px 0 24px 36px; }
.dm-link:hover { color: var(--ink); }
.dm-link:focus-visible { outline-offset: 4px; }
.dm-name { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 22px; line-height: 1.3; letter-spacing: 0.08em; color: var(--heading); }
.dm-scope { margin: 0; max-width: 34em; font-size: var(--s-sm); line-height: 1.75; color: var(--muted); }
.dm-cta { font-size: var(--s-sm); font-weight: 600; color: var(--link); }
.dm-link:hover .dm-name { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 6px; }
.dm-link:hover .dm-cta { color: var(--link-hover); }
.home-aside { margin: 0; font-size: var(--s-sm); color: var(--muted); }
.home-aside a { font-weight: 600; }
/* what's next: a plain list, three rows until expanded */
.hsec-next { max-width: 900px; }
.nx-list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line-strong); }
.nx { display: grid; grid-template-columns: 128px minmax(0, 1fr) auto; gap: 4px 20px; align-items: baseline; padding: 12px 0; border-bottom: 1px solid var(--line); }
.nx-date { font-weight: 700; color: var(--heading); font-variant-numeric: lining-nums tabular-nums; white-space: nowrap; }
.nx-date .wd { margin-left: 6px; font-weight: 400; font-size: var(--s-xs); color: var(--muted); }
.nx-title { font-size: 16px; line-height: 1.6; color: var(--ink); }
a.nx-title { text-decoration: none; }
a.nx-title:hover { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.nx-type { font-size: var(--s-xs); line-height: 1.6; color: var(--tag-ink); background: var(--tag-bg); border-radius: var(--radius-sm); padding: 0 7px; white-space: nowrap; }
.nx-more { justify-self: start; }
@media (max-width: 700px) {
  .dm-list { grid-template-columns: minmax(0, 1fr); }
  .dm:nth-child(even) { border-left: 0; }
  .dm + .dm { border-top: 1px solid var(--line); }
  .dm-link, .dm:nth-child(even) .dm-link { padding: 20px 0 22px; }
}
@media (max-width: 640px) {
  .home-lede { font-size: 18px; }
  .hsec-title { font-size: 21px; }
  .hl-lead .hl-link { padding: 22px 0 24px; }
  .hl-lead .hl-title { font-size: 24px; }
  .hl-lead .hl-blurb { font-size: 17px; }
  .hl-side .hl-link { padding: 18px 0 20px; }
  .hl-side .hl-title { font-size: 19px; }
  .nx { grid-template-columns: 84px minmax(0, 1fr); }
  .nx-date .wd { display: block; margin-left: 0; }
  .nx-type { grid-column: 2; justify-self: start; }
}

/* weekly digest */
.digest { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 32px 40px 36px; display: grid; gap: 32px; max-width: 960px; }
.dg-head { display: grid; gap: 8px; border-bottom: 2px solid var(--gold); padding-bottom: 18px; }
.dg-kicker { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: var(--s-xs); color: var(--muted); letter-spacing: 0.04em; }
.dg-kicker select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 2px 8px; font-size: var(--s-xs); }
.dg-title { font-family: var(--f-display); font-weight: 700; font-size: var(--s-xl); line-height: 1.35; letter-spacing: 0.04em; margin: 0; color: var(--heading); }
.dg-lead { margin: 4px 0 0; font-size: 17px; line-height: 1.85; max-width: 46em; }
.dg-body { display: grid; gap: 30px; }
.dg-sec-title { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin: 0 0 12px; font-family: var(--f-display); font-size: var(--s-lg); letter-spacing: 0.05em; color: var(--charcoal); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.dg-sec-title .n { font-family: var(--f-mono); font-size: var(--s-xs); font-weight: 400; letter-spacing: 0; color: var(--faint); }
.dg-sum { margin: 0 0 12px; color: var(--muted); font-size: var(--s-sm); max-width: 46em; }
.dg-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; }
.dg-link { display: grid; gap: 4px; width: 100%; text-align: left; border: 0; border-left: 3px solid var(--gold); background: none; border-radius: 0; padding: 6px 0 6px 16px; cursor: pointer; }
.dg-link:hover { background: var(--hover); }
.dg-link:hover .dg-item-title { color: var(--link); text-decoration: underline; text-underline-offset: 3px; }
.dg-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.dg-meta .code { font-family: var(--f-mono); font-weight: 600; letter-spacing: 0.03em; color: var(--cc); }
.dg-item-title { display: block; font-weight: 500; line-height: 1.5; color: var(--heading); }
.dg-note { display: block; font-size: var(--s-sm); color: var(--muted); line-height: 1.7; }
.dg-ahead { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.dg-ahead-item { display: grid; grid-template-columns: 44px 60px minmax(0, 1fr) auto; gap: 8px; align-items: baseline; font-size: var(--s-sm); }
.dg-ahead-item .code { font-family: var(--f-mono); font-size: var(--s-xs); font-weight: 600; color: var(--cc); }
.dg-foot { margin: 0; font-size: var(--s-xs); color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
@media (max-width: 640px) {
  .digest { padding: 18px 16px; }
  .dg-ahead-item { grid-template-columns: 40px minmax(0, 1fr); }
  .dg-ahead-item .code { display: none; }
  .dg-ahead-item .ag-cal { grid-column: 2; }
}
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { border: 1px solid var(--line-strong); background: transparent; border-radius: 999px; padding: 2px 11px; font-size: var(--s-xs); color: var(--muted); cursor: pointer; }
.tag:hover { border-color: var(--link); color: var(--link); background: var(--hover); }

.r-nav { display: flex; justify-content: space-between; gap: 10px; border-top: 1px solid var(--line); padding-top: 20px; }
.r-nav .btn[disabled], .r-nav .btn[disabled]:hover { color: var(--disabled); border-color: var(--line); background: var(--paper); cursor: default; }

.toast.ok { background: var(--ok-bg); color: #FFFFFF; }
.toast.err { background: var(--err-bg); color: #FFFFFF; }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--heading); color: var(--paper); padding: 8px 16px; border-radius: 999px; font-size: var(--s-sm); z-index: 40; box-shadow: var(--shadow-hover); }

/* footer band */
.foot { background: var(--band); color: var(--band-muted); border-top: 1px solid var(--band-edge); font-size: var(--s-xs); }
.foot-inner { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 22px; padding-block: 24px calc(24px + env(safe-area-inset-bottom, 0px)); }
.foot a { color: var(--band-ink); text-decoration-color: var(--band-line); }
.foot a:hover { color: var(--band-ink); text-decoration-color: var(--band-ink); }
.foot :focus-visible { outline-color: var(--focus-band); }
.foot-by { flex-basis: 100%; overflow-wrap: anywhere; }
.foot-name { font-family: var(--f-display); font-weight: 700; font-size: var(--s-sm); letter-spacing: 0.08em; color: var(--band-ink); }

@media (max-width: 520px) {
  h1 { font-size: 24px; letter-spacing: 0.05em; }
  .mast-inner { padding-block: 18px 16px; gap: 8px; }
  .brand { gap: 12px; }
  .emblem { width: 40px; height: 40px; }
  .eyebrow { font-size: 10px; letter-spacing: 0.12em; }
  .mast-art { width: 380px; height: 380px; right: -150px; top: -150px; }
  .st-cov { display: none; }
  .row { padding: 14px 12px 15px; }
  .row-title { font-size: 17px; }
}
@media (prefers-reduced-motion: no-preference) {
  .row, .fpill, .chip, .btn, .back, .srcbtn, .sec-tab, .dg-link, .si-btn, .ftoggle { transition: background-color .15s, border-color .15s, color .15s, box-shadow .2s; }
}

        e.n++; e.imp += (+it.importance || 1);

    return Object.keys(map).map(function (k) {

        "aria-pressed": w.text.toLowerCase() === active ? "true" : "false", onclick: function () { opts.pick(w); } }, w.text);

    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("homeLink").addEventListener("click", function (e) { e.preventDefault(); goSection("home"); });
  // sidebar: 案件追蹤 open beside the list on wide screens; 即將到來 and the keyword cloud closed until opened
  (function () {
    var wide = window.matchMedia("(min-width: 1060px)").matches;
    document.getElementById("sideCases").open = wide;
    document.getElementById("sideAgenda").open = false;
    document.getElementById("sideCloud").open = loadPref("ild.cloudOpen") === "1";
  })();
  document.getElementById("sideCloud").addEventListener("toggle", function () {
    savePref("ild.cloudOpen", this.open ? "1" : "");
    renderCloud();
  });
  document.getElementById("icsAll").addEventListener("click", function () {
    var list = upcomingAgenda(state.section).filter(function (a) { return str(a.date); });
    if (list.length) downloadIcs(list, state.section);
  });
  document.getElementById("sections").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var i = SECTION_ORDER.indexOf(state.section);
    var next = SECTION_ORDER[(i + (e.key === "ArrowRight" ? 1 : SECTION_ORDER.length - 1)) % SECTION_ORDER.length];
    e.preventDefault(); setSection(next);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (state.openId || state.openCase)) closeReader();
  });

  function renderAll() {
    renderSections(); renderStatus(); renderFilters(); renderAgenda(); renderCases(); renderCloud(); renderList();
    if (state.openId && !S().items.some(function (i) { return i.id === state.openId; })) state.openId = "";
    renderReader();
  }

  // ---- data ----
  // Start on the home page unless the link names a tab (#pil, #arb, #week), an entry or a case.
  var initialHash = "";
  try { initialHash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (SECTIONS[initialHash]) state.section = initialHash;

  var hashTried = false;
  function tryHash() {
    if (hashTried) return;
    var id = initialHash;
    if (!id || SECTIONS[id]) { hashTried = true; return; }
    var pending = ITEM_SECTIONS.some(function (k) { return !data[k].loaded && !data[k].loadError; });
    if (/^case-/.test(id)) {
      var cid = id.slice(5), ck = caseSectionOf(cid);
      if (!ck && pending) return;
      hashTried = true;
      if (ck) openCase(cid);
      return;
    }
    var key = sectionOf(id);
    if (!key && pending) return; // wait until both files are in
    hashTried = true;
    if (key) openItem(id);
  }

  renderAll();

  // Content lives in data.json (國際公法), arbitration.json (國際仲裁法) and digest.json (本週重點), published alongside this page.
  function cleanList(v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === "object" && typeof x.id === "string" && x.id; }) : []; }
  SECTION_ORDER.filter(function (key) { return SECTIONS[key].file; }).forEach(function (key) {
    var d = data[key];
    fetch(SECTIONS[key].file, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (x) {
        d.items = cleanList(x.items);
        d.agenda = cleanList(x.agenda);
        d.cases = cleanList(x.cases);
        d.issues = cleanList(x.issues).sort(function (a, b) { return str(a.from) < str(b.from) ? 1 : -1; });
        d.meta = x.meta && typeof x.meta === "object" ? x.meta : null;
        d.archives = Array.isArray(x.archives) ? x.archives.filter(function (a) { return a && typeof a.file === "string"; }).map(function (a) { return { file: a.file, label: a.label, loaded: false }; }) : [];
        d.loaded = true;
      })
      .catch(function () { d.loadError = true; })
      .then(function () {
        if (key === state.section || state.section === "home" || (state.section === "week" && key !== "week")) renderAll(); else { renderSections(); }
        tryHash();
      });
  });
})();
</script>

</body>
</html>
