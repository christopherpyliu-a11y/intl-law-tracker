<style>
/* Layout: masthead with court docket filters and an upcoming-dates strip, then a two-pane docket —
   chronological entries on the left, a case-note reader on the right (an overlay on phones). */
:root {
  --paper: #F1F4F3;
  --surface: #FFFFFF;
  --ink: #15201E;
  --muted: #56655F;
  --faint: #86948F;
  --line: #D4DDD9;
  --accent: #2C6A5E;
  --accent-ink: #FFFFFF;
  --accent-soft: #E1ECE8;
  --note: #FAF3DF;
  --note-line: #E2CC8C;
  --note-ink: #5A4712;
  --c-icj: #2A66A0;
  --c-icc: #8D3452;
  --c-ecthr: #3A4B9C;
  --c-iacthr: #A0601C;
  --c-acthpr: #3E7A2B;
  --c-itlos: #127E8A;
  --c-other: #65706C;
  --f-display: "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
  --f-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --s-xs: 12px; --s-sm: 13.5px; --s-md: 15.5px; --s-lg: 19px; --s-xl: 25px; --s-xxl: 30px;
  --radius: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1413; --surface: #151D1B; --ink: #E2EAE7; --muted: #9AABA5; --faint: #6D7E79; --line: #26322F;
    --accent: #6CB6A5; --accent-ink: #0E1413; --accent-soft: #1A2B27;
    --note: #262113; --note-line: #5C4E2B; --note-ink: #E6D29A;
    --c-icj: #82B4E6; --c-icc: #E38FAA; --c-ecthr: #A0ACF2; --c-iacthr: #E5A866; --c-acthpr: #93CC7C; --c-itlos: #6FCAD4; --c-other: #A6B0AC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1413; --surface: #151D1B; --ink: #E2EAE7; --muted: #9AABA5; --faint: #6D7E79; --line: #26322F;
  --accent: #6CB6A5; --accent-ink: #0E1413; --accent-soft: #1A2B27;
  --note: #262113; --note-line: #5C4E2B; --note-ink: #E6D29A;
  --c-icj: #82B4E6; --c-icc: #E38FAA; --c-ecthr: #A0ACF2; --c-iacthr: #E5A866; --c-acthpr: #93CC7C; --c-itlos: #6FCAD4; --c-other: #A6B0AC;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--s-md);
  line-height: 1.65;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.app { max-width: 1320px; margin: 0 auto; display: grid; gap: 18px; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* court colour hook */
[data-court="ICJ"] { --cc: var(--c-icj); }
[data-court="ICC"] { --cc: var(--c-icc); }
[data-court="ECtHR"] { --cc: var(--c-ecthr); }
[data-court="IACtHR"] { --cc: var(--c-iacthr); }
[data-court="ACtHPR"] { --cc: var(--c-acthpr); }
[data-court="ITLOS"] { --cc: var(--c-itlos); }
[data-court="OTHER"] { --cc: var(--c-other); }
/* arbitration categories reuse the same palette */
[data-court="COURT"] { --cc: var(--c-ecthr); }
[data-court="AWARD"] { --cc: var(--c-iacthr); }
[data-court="INST"] { --cc: var(--c-itlos); }
[data-court="LAW"] { --cc: var(--c-acthpr); }
[data-court="NEWS"] { --cc: var(--c-icc); }

/* masthead */
.mast { display: grid; gap: 14px; border-bottom: 2px solid var(--ink); padding-bottom: 14px; }
.mast-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 10px 24px; }
.eyebrow { font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.14em; color: var(--muted); text-transform: uppercase; }
.byline { margin: 6px 0 0; font-size: var(--s-sm); color: var(--muted); overflow-wrap: anywhere; }
.byline a { color: inherit; text-decoration-color: var(--line); }
.byline a:hover { color: var(--accent); text-decoration-color: currentColor; }
h1 { font-family: var(--f-display); font-weight: 700; font-size: var(--s-xxl); line-height: 1.2; margin: 2px 0 0; letter-spacing: 0.02em; text-wrap: balance; }
.status { font-size: var(--s-sm); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 14px; }
.status b { color: var(--ink); font-weight: 500; }

/* section tabs: 國際公法 / 國際仲裁法 */
.sections { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.sec-tab {
  flex: 0 0 auto; display: inline-flex; align-items: baseline; gap: 8px;
  border: 0; background: none; cursor: pointer; padding: 6px 14px 9px; margin-bottom: -1px;
  border-bottom: 3px solid transparent; color: var(--muted);
  font-family: var(--f-display); font-weight: 700; font-size: var(--s-lg); line-height: 1.3;
}
.sec-tab:first-child { padding-left: 2px; }
.sec-tab .en { font-family: var(--f-mono); font-weight: 400; font-size: var(--s-xs); letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
.sec-tab .n { font-family: var(--f-mono); font-weight: 500; font-size: var(--s-xs); color: var(--accent); }
.sec-tab:hover { color: var(--ink); }
.sec-tab[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
@media (max-width: 640px) { .sec-tab .en { display: none; } .sec-tab { font-size: var(--s-md); padding-inline: 10px; } }

.courts { display: flex; flex-wrap: wrap; gap: 6px; }
.court-chip {
  display: inline-flex; align-items: baseline; gap: 8px;
  border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
  padding: 5px 12px; cursor: pointer; font-size: var(--s-sm); line-height: 1.3;
}
.court-chip .code { font-family: var(--f-mono); font-weight: 500; color: var(--cc, var(--ink)); }
.court-chip .n { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--faint); }
.court-chip:hover { border-color: var(--cc, var(--accent)); }
.court-chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.court-chip[aria-pressed="true"] .code, .court-chip[aria-pressed="true"] .n, .court-chip[aria-pressed="true"] .fld { color: var(--paper); }

/* agenda strip */
.agenda { display: grid; gap: 8px; }
.sec-label { font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin: 0; font-weight: 500; }
.agenda-list { list-style: none; margin: 0; padding: 0 0 4px; display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x proximity; }
.strip-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; }
.strip-note { font-size: var(--s-xs); color: var(--faint); }
.ag {
  flex: 0 0 auto; width: 236px; scroll-snap-align: start;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; color: var(--ink);
}
.ag:hover { border-color: var(--cc, var(--accent)); }
.ag-main { flex: 1; display: grid; gap: 4px; align-content: start; border: 0; background: none; padding: 0; margin: 0; text-align: left; color: inherit; text-decoration: none; cursor: pointer; }
div.ag-main { cursor: default; }
.ag-title, .ag-note { display: block; }
.ag-foot { border-top: 1px dashed var(--line); padding-top: 6px; }
.ag-cal { font-size: var(--s-xs); color: var(--accent); text-decoration: none; white-space: nowrap; }
.ag-cal:hover { text-decoration: underline; }
.case-card { width: 268px; }
.case-card .ag-note { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.case-card.is-open { border-color: var(--cc, var(--accent)); box-shadow: inset 0 3px 0 var(--cc, var(--accent)); }
.ag-top { display: flex; justify-content: space-between; gap: 8px; font-family: var(--f-mono); font-size: var(--s-xs); }
.ag-top .code { color: var(--cc); font-weight: 500; }
.ag-top .when { color: var(--muted); }
.ag-top .when.soon { color: var(--accent); font-weight: 500; }
.ag-title { font-size: var(--s-sm); line-height: 1.45; font-weight: 500; }
.ag-note { font-size: var(--s-xs); color: var(--muted); line-height: 1.5; }

/* tools */
.tools { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.search { flex: 1 1 260px; min-width: 0; position: relative; }
.search input {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius);
  padding: 8px 12px; font-size: var(--s-sm);
}
.tools select { border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 7px 10px; font-size: var(--s-sm); }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--s-sm); color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; padding: 2px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.seg button { display: inline-flex; align-items: baseline; gap: 6px; border: 0; background: none; border-radius: 999px; padding: 4px 12px; font-size: var(--s-sm); color: var(--muted); cursor: pointer; }
.seg button .n { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--faint); }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.seg button[aria-pressed="true"] .n { color: var(--paper); }
.linkish { border: 0; background: none; padding: 0; font-size: var(--s-sm); color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* split: the list uses the full width until an entry is opened */
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 0; align-items: start; }
@media (min-width: 900px) {
  body.reading .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 28px; }
}

/* list */
.list { display: grid; gap: 18px; min-width: 0; }
.day { display: grid; gap: 8px; min-width: 0; }
.day-items { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); }
body.reading .day-items { grid-template-columns: minmax(0, 1fr); gap: 6px; }
.day-head { display: flex; align-items: baseline; gap: 10px; }
.day-head .d { font-family: var(--f-display); font-weight: 700; font-size: var(--s-md); }
.day-head .iso { font-family: var(--f-mono); font-size: var(--s-xs); color: var(--faint); }
.day-head .rule { flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }

.row {
  display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 4px 10px;
  width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 12px 12px 13px; align-content: start;
}
.row:hover { border-color: var(--cc); }
.row[aria-current="true"] { background: var(--surface); border-color: var(--cc); box-shadow: inset 3px 0 0 var(--cc); }
.row .code { font-family: var(--f-mono); font-size: var(--s-xs); font-weight: 500; color: var(--cc); padding-top: 3px; }
.row-main { min-width: 0; display: grid; gap: 3px; }
.row-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; font-size: var(--s-xs); color: var(--muted); }
.kind { border: 1px solid var(--line); border-radius: 3px; padding: 0 5px; line-height: 1.55; }
.key { color: var(--accent); font-weight: 500; }
.fld { font-weight: 500; color: var(--c-ecthr); }
.fld.inv { color: var(--c-icc); }
.unread-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); display: inline-block; }
.starred { color: var(--c-iacthr); }
.row-title { font-weight: 500; font-size: var(--s-md); line-height: 1.45; }
.row.is-read .row-title { color: var(--muted); font-weight: 400; }
.row-tldr { font-size: var(--s-sm); color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
body.reading .row-tldr { -webkit-line-clamp: 2; }
/* commentary is lighter than court news */
.row.is-comment { background: color-mix(in srgb, var(--surface) 45%, var(--paper)); }
.row.is-comment .row-title { font-weight: 400; }
.row.is-comment .code { opacity: 0.7; }
.case-tag { font-size: var(--s-xs); color: var(--accent); }

.empty { border: 1px dashed var(--line); border-radius: var(--radius); padding: 22px 18px; color: var(--muted); font-size: var(--s-sm); background: var(--surface); }
.empty strong { color: var(--ink); display: block; font-size: var(--s-md); margin-bottom: 4px; font-weight: 500; }

/* reader */
.reader {
  display: none; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
}
@media (min-width: 900px) {
  body.reading .reader {
    display: block; position: sticky; top: max(12px, env(safe-area-inset-top, 0px));
    max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain;
  }
}
@media (max-width: 899.98px) {
  body.reading { overflow: hidden; }
  body.reading .reader {
    display: block; position: fixed; inset: 0; z-index: 20; border: 0; border-radius: 0;
    overflow-y: auto; overscroll-behavior: contain;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
}
.r-wrap { padding: 22px 26px 28px; display: grid; gap: 22px; max-width: 760px; }
@media (max-width: 899.98px) { .r-wrap { padding: 14px 16px 32px; } }
.back { display: inline-block; justify-self: start; border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 12px; font-size: var(--s-sm); cursor: pointer; }
.back:hover { border-color: var(--accent); }
.back .d { display: none; }
@media (min-width: 900px) { .back .m { display: none; } .back .d { display: inline; } }

.r-head { display: grid; gap: 8px; border-bottom: 1px solid var(--line); padding-bottom: 18px; }
.r-court { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: var(--s-sm); color: var(--muted); }
.r-court .code { font-family: var(--f-mono); font-weight: 500; color: var(--cc); background: color-mix(in srgb, var(--cc) 12%, transparent); padding: 1px 7px; border-radius: 3px; }
.r-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: var(--s-sm); color: var(--muted); }
.r-title { font-family: var(--f-display); font-weight: 700; font-size: var(--s-xl); line-height: 1.35; margin: 0; text-wrap: balance; }
.r-orig { margin: 0; font-style: italic; color: var(--muted); font-size: var(--s-sm); line-height: 1.5; overflow-wrap: anywhere; }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 5px 12px; font-size: var(--s-sm); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--c-iacthr); color: var(--c-iacthr); }

.r-sec { display: grid; gap: 8px; }
.r-sec h3 { margin: 0; font-family: var(--f-mono); font-size: var(--s-xs); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); font-weight: 500; display: flex; gap: 8px; align-items: baseline; }
.r-sec h3 .zh { font-family: var(--f-body); letter-spacing: 0.04em; font-size: var(--s-sm); color: var(--ink); font-weight: 700; text-transform: none; }
.r-sec p { margin: 0; max-width: 42em; }
.r-sec p + p { margin-top: 6px; }
.r-sec ul { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; max-width: 42em; }
.r-sec li::marker { color: var(--faint); }
.r-sec .lead-note { list-style: none; margin-left: -1.3em; color: var(--muted); font-size: var(--s-sm); }

.tldr { background: var(--accent-soft); border-radius: var(--radius); padding: 14px 16px; }
.tldr p { font-size: 16.5px; line-height: 1.75; }

.note { background: var(--note); border: 1px solid var(--note-line); border-radius: var(--radius); padding: 12px 14px; color: var(--note-ink); }
.note h3, .note h3 .zh { color: var(--note-ink); }
.note p { font-size: var(--s-sm); }

.sources ul { list-style: none; padding: 0; gap: 8px; }
.src { display: grid; gap: 2px; }
.src a { font-size: var(--s-sm); line-height: 1.5; overflow-wrap: anywhere; }
.src .src-meta { display: flex; gap: 8px; align-items: center; font-size: var(--s-xs); color: var(--faint); font-family: var(--f-mono); }
.badge { font-family: var(--f-body); font-size: 11px; border-radius: 3px; padding: 0 5px; line-height: 1.6; border: 1px solid var(--line); color: var(--muted); }
.badge.off { border-color: var(--accent); color: var(--accent); }

.memo { border: 1px solid var(--line); border-left: 3px solid var(--ink); border-radius: var(--radius); padding: 12px 14px; background: var(--surface); }
.memo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.memo p { font-size: var(--s-sm); line-height: 1.85; }
.btn-sm { padding: 2px 10px; font-size: var(--s-xs); }
.case-line { margin: 0; }
.mini-tl { list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 4px; }
.mini-tl .linkish { text-align: left; text-decoration: none; color: var(--ink); line-height: 1.5; }
.mini-tl .linkish:hover { color: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 16px !important; border-left: 2px solid var(--line); display: grid; gap: 14px; }
.timeline li { position: relative; display: grid; gap: 4px; }
.timeline li::before { content: ""; position: absolute; left: -23px; top: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--cc); border: 2px solid var(--surface); }
.tl-date { font-size: var(--s-xs); color: var(--muted); }
.tl-card { display: grid; gap: 3px; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 8px 10px; cursor: pointer; }
.tl-card:hover { border-color: var(--cc); }
.tl-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: var(--s-xs); color: var(--muted); }
.tl-meta .code { font-family: var(--f-mono); color: var(--cc); font-weight: 500; }
.tl-title { display: block; font-weight: 500; line-height: 1.45; }
.timeline li.is-comment .tl-title { font-weight: 400; }

<body>
<div class="app">

<script>
(function () {

      },
      order: ["COURT", "AWARD", "INST", "LAW", "NEWS", "OTHER"],
      genres: { news: "裁判與動態", comment: "評論" },
      placeholder: "搜尋案名、關鍵字、法域、條文（例：anti-suit、ICSID、紐約公約、第68條）",
      loadingText: "國際商務仲裁與投資條約仲裁的法院裁判、仲裁判斷、機構動態與評論會顯示在這裡。",
      emptyText: "每日排程更新後，新的仲裁動態會依日期排列在這裡。",
      filterHint: "試著清除搜尋字詞，或改選「全部」。"
    },
    week: {
      label: "本週重點", en: "Weekly", file: "digest.json", digest: true,

    }
  };
  var SECTION_ORDER = ["pil", "arb", "week"];
  var ITEM_SECTIONS = ["pil", "arb"];
  var WEEK = ["日", "一", "二", "三", "四", "五", "六"];
  var SITE_NAME = "國際法動態追蹤";

  function blank() { return { items: [], agenda: [], cases: [], issues: [], meta: null, archives: [], loaded: false, loadError: false, archiveLoading: "" }; }
  var data = { pil: blank(), arb: blank(), week: blank() };

  // ---- per-viewer conveniences (browser only) ----
  function loadSet(key) { try { var v = localStorage.getItem(key); return new Set(v ? JSON.parse(v) : []); } catch (e) { return new Set(); } }
  function saveSet(key, set) { try { localStorage.setItem(key, JSON.stringify(Array.from(set))); } catch (e) {} }
  function loadPref(key) { try { return localStorage.getItem(key) || ""; } catch (e) { return ""; } }
  function savePref(key, v) { try { localStorage.setItem(key, v); } catch (e) {} }
  var readSet = loadSet("ild.read");
  var starSet = loadSet("ild.star");

  var savedGenre = loadPref("ild.genre");
  var state = { section: "pil", field: "", genre: (savedGenre === "news" || savedGenre === "comment") ? savedGenre : "", court: "", kind: "", q: "", unreadOnly: false, starOnly: false, openId: "", openCase: "", issueId: "" };
  function S() { return data[state.section]; }
  function CFG() { return SECTIONS[state.section]; }

  // ---- helpers ----
  function h(tag, attrs) {

      else if (k.slice(0, 2) === "on") el.addEventListener(k.slice(2), v);

  }
  function str(v) { return typeof v === "string" ? v : (v == null ? "" : String(v)); }
  function arr(v) { return Array.isArray(v) ? v.filter(function (x) { return typeof x === "string" && x.trim(); }) : (typeof v === "string" && v.trim() ? [v] : []); }
  function courtKey(c, sec) { var cats = SECTIONS[sec || state.section].cats; return cats[c] ? c : "OTHER"; }
  function catOf(k, sec) { return SECTIONS[sec || state.section].cats[k] || { code: "", zh: "", en: "" }; }
  function codeText(it, sec) { var k = courtKey(it.court, sec); return it.outletCode ? str(it.outletCode) : catOf(k, sec).code; }
  function todayISO() {
    try { return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date()); }

  function zhDate(d) { var x = parseISO(d); return x ? (x.getMonth() + 1) + "月" + x.getDate() + "日（週" + WEEK[x.getDay()] + "）" : "日期未定"; }

  function safeUrl(u) { u = str(u); return /^https?:\/\//i.test(u) ? u : ""; }

  function toast(msg) {

  }
  function pageUrl() { try { return location.origin + location.pathname; } catch (e) { return ""; } }
  function sectionOf(id) {
    for (var i = 0; i < ITEM_SECTIONS.length; i++) {
      var key = ITEM_SECTIONS[i];
      if (data[key].items.some(function (x) { return x.id === id; })) return key;

    return "";
  }
  function caseSectionOf(cid) {
    for (var i = 0; i < ITEM_SECTIONS.length; i++) {

  function findItem(id) { var s = sectionOf(id); return s ? { sec: s, it: data[s].items.find(function (x) { return x.id === id; }) } : null; }
  function isCommentKind(kind) { kind = str(kind); return kind === "學術評論" || kind === "實務評論"; }
  function isComment(it) { return isCommentKind(it.kind); }
  function fieldOf(it) { return str(it.field) === "investment" ? "investment" : "commercial"; }
  function fieldCfg(it, sec) { var f = SECTIONS[sec || state.section].fields; return f ? f[fieldOf(it)] : null; }

  // ---- clipboard ----
  function copyText(text, okMsg) {
    function fallback() {
      try {
        var ta = h("textarea", { style: "position:fixed;left:-9999px;top:0", "aria-hidden": "true" });

  }
  function memoText(it) {
    var lines = [];
    lines.push(str(it.titleOriginal) || str(it.title));
    var meta = [str(it.date)]; if (it.caseRef) meta.push(str(it.caseRef));
    lines.push("（" + meta.join("；") + "）");
    lines.push(str(it.memo));
    var srcs = Array.isArray(it.sources) ? it.sources.filter(function (s) { return s && safeUrl(s.url); }) : [];
    var src = srcs.find(function (s) { return s.official; }) || srcs[0];

  }

  // ---- calendar ----
  function ymd(d) { return str(d).replace(/-/g, ""); }

  }
  function eventText(a, sec) {

  }
  function gcalUrl(a, sec) {
    var t = eventText(a, sec);
    return "https://calendar.google.com/calendar/render?action=TEMPLATE&text=" + encodeURIComponent(t.title) +

  function icsEscape(s) { return str(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,").replace(/\r?\n/g, "\\n"); }

  function downloadIcs(list, sec) {
    var now = new Date().toISOString().replace(/[-:]/g, "").replace(/\.\d+Z$/, "Z");

      "X-WR-CALNAME:" + icsEscape(SITE_NAME + "（" + SECTIONS[sec].label + "）")];
    list.forEach(function (a) {
      var t = eventText(a, sec);
      lines.push("BEGIN:VEVENT", "UID:" + icsEscape(str(a.id)) + "@intl-law-tracker", "DTSTAMP:" + now,

        "SUMMARY:" + icsEscape(t.title), "DESCRIPTION:" + icsEscape(t.details));

      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    var body = lines.map(icsFold).join("\r\n") + "\r\n";
    try {
      var blob = new Blob([body], { type: "text/calendar;charset=utf-8" });
      var url = URL.createObjectURL(blob);
      var a = h("a", { href: url, download: "intl-law-" + sec + "-agenda.ics" });

  }

    var tbd = d.agenda.filter(function (a) { return !str(a.date); });
    return dated.concat(tbd);
  }

  // ---- filtering ----
  function sortItems(list) {
    return list.slice().sort(function (a, b) {
      var da = str(a.date), db = str(b.date);
      if (da !== db) return da < db ? 1 : -1;
      var ca = isComment(a) ? 1 : 0, cb = isComment(b) ? 1 : 0;
      if (ca !== cb) return ca - cb;

    });

  function matches(it, ignoreGenre) {

    if (state.kind && str(it.kind) !== state.kind) return false;

        h("div", { class: "r-court" }, h("span", { class: "code", text: codeText(it) }), h("span", { text: headText })),
        h("div", { class: "r-meta" },
          h("span", { class: "mono", text: str(it.date) }),
          fieldCfg(it) ? h("span", { class: "fld" + (fieldOf(it) === "investment" ? " inv" : ""), text: fieldCfg(it).zh }) : null,
          it.kind ? h("span", { text: str(it.kind) }) : null,
          it.jurisdiction ? h("span", { text: "法域：" + str(it.jurisdiction) }) : null,
          it.author ? h("span", { text: "作者：" + str(it.author) }) : null,
          it.caseRef ? h("span", { class: "mono", text: str(it.caseRef) }) : null
        ),
        h("h2", { class: "r-title", text: str(it.title) }),
        it.titleOriginal ? h("p", { class: "r-orig", text: str(it.titleOriginal) }) : null,
        h("div", { class: "r-actions" },
          h("button", { class: "btn", type: "button", "aria-pressed": starred ? "true" : "false", onclick: function () { toggleStar(it.id); }, text: starred ? "★ 已收藏" : "☆ 收藏" }),
          h("button", { class: "btn", type: "button", onclick: function () { markUnread(it.id); }, text: "標為未讀" }),
          cs ? h("button", { class: "btn", type: "button", onclick: function () { openCase(cs.id); }, text: "本案時間軸" }) : null
        )
      ),
      it.tldr ? sec("Plain-language summary", "白話摘要", h("p", { text: str(it.tldr) }), "tldr") : null,
      memoSec,
      it.context ? sec("Context", "背景脈絡", parasEl(it.context)) : null,
      facts.length ? sec("Facts", "事實", listEl(facts)) : null,
      issues.length ? sec("Issues", isCom ? "討論的法律問題" : "爭點", listEl(issues)) : null,
      it.holding ? sec(hl[1], hl[0], parasEl(it.holding)) : null,
      it.significance ? sec(isCom ? "Conclusions" : "Significance & next steps", isCom ? "作者結論與意義" : "意義與後續", parasEl(it.significance)) : null,
      it.editorNote ? sec("Assistant's notes", "本網頁助理補充", parasEl(it.editorNote), "note") : null,
      caseSec,
      related.length ? sec("Related", "相關動態", h("div", { class: "tags" }, related.map(function (ri) {
        return h("button", { class: "btn", type: "button", "data-court": courtKey(ri.court), onclick: function () { openItem(ri.id); } },
          h("span", { class: "mono", style: "color:var(--cc);margin-right:6px", text: codeText(ri) }), str(ri.title));
      }))) : null,
      sources.length ? sec("Original sources", "原始資料", h("ul", null, sources.map(function (s) {
        return h("li", { class: "src" },
          h("a", { href: safeUrl(s.url), target: "_blank", rel: "noopener noreferrer", text: str(s.label) || safeUrl(s.url) }),
          h("span", { class: "src-meta" }, s.official ? h("span", { class: "badge off", text: "官方" }) : h("span", { class: "badge", text: "報導／評論" }), h("span", { text: hostOf(s.url) }))
        );
      })), "sources") : null,
      tags.length ? h("div", { class: "tags", "aria-label": "關鍵字" }, tags.map(function (t) {
        return h("button", { class: "tag", type: "button", text: "#" + t, onclick: function () { setQuery(t); } });
      })) : null,
      h("nav", { class: "r-nav" },
        h("button", { class: "btn", type: "button", disabled: !newer, onclick: function () { if (newer) openItem(newer.id); }, text: "← 較新一則" }),
        h("button", { class: "btn", type: "button", disabled: !older, onclick: function () { if (older) openItem(older.id); }, text: "較舊一則 →" })
      )
    );
    r.replaceChildren(wrap);
    r.scrollTop = 0;
  }

  function renderCaseView(r) {
    var secKey = state.section;
    var c = caseById(state.openCase, secKey);
    if (!c) { state.openCase = ""; r.replaceChildren(); document.body.classList.remove("reading"); return; }
    var k = courtKey(c.court, secKey);
    var items = sortItems(caseItems(c.id, secKey));
    var relatedIds = new Set(items.map(function (i) { return i.id; }));
    var today = todayISO();
    var ahead = data[secKey].agenda.filter(function (a) {
      return (a.caseId === c.id || (a.relatedId && relatedIds.has(a.relatedId))) && (!str(a.date) || str(a.date) >= today);
    }).sort(function (a, b) { return str(a.date || "9999") < str(b.date || "9999") ? -1 : 1; });
    var wrap = h("div", { class: "r-wrap", "data-court": k },
      backBtn(),
      h("header", { class: "r-head" },
        h("div", { class: "r-court" }, h("span", { class: "code", text: str(c.type) || "案件" }), h("span", { text: [str(c.forum), str(c.caseRef)].filter(Boolean).join(" · ") })),
        h("h2", { class: "r-title", text: str(c.name) }),
        c.nameOriginal ? h("p", { class: "r-orig", text: str(c.nameOriginal) }) : null,
        h("div", { class: "r-meta" }, h("span", { text: "共 " + items.length + " 則動態" }), items[0] ? h("span", { text: "最新 " + str(items[0].date) }) : null)
      ),
      c.summary ? sec("Overview", "案件概要", h("p", { text: str(c.summary) }), "tldr") : null,
      c.status ? sec("Status", "目前狀態", h("p", { text: str(c.status) })) : null,
      ahead.length ? sec("Upcoming", "接下來", h("ul", { class: "case-ahead" }, ahead.map(function (a) {
        return h("li", null, h("span", { class: "mono", text: a.date ? str(a.date) : "日期未定" }), h("span", { text: str(a.title) }),
          a.date ? h("a", { class: "ag-cal", href: gcalUrl(a, secKey), target: "_blank", rel: "noopener noreferrer" }, "＋ Google 行事曆") : null);
      }))) : null,
      sec("Timeline", "時間軸", h("ol", { class: "timeline" }, items.map(function (it) {
        return h("li", { "data-court": courtKey(it.court, secKey) + "" , class: isComment(it) ? "is-comment" : null },
          h("span", { class: "tl-date mono", text: str(it.date) }),
          h("button", { type: "button", class: "tl-card", onclick: function () { openItem(it.id); } },
            h("span", { class: "tl-meta" }, h("span", { class: "code", text: codeText(it, secKey) }), it.kind ? h("span", { text: str(it.kind) }) : null, !readSet.has(it.id) ? h("span", { class: "unread-dot", title: "未讀" }) : null),
            h("span", { class: "tl-title", text: str(it.title) }),
            it.tldr ? h("span", { class: "tl-tldr", text: str(it.tldr) }) : null));
      }))),
      h("p", { class: "case-foot", text: "時間軸依本站收錄的動態排列（新到舊），案件概要與狀態由本網頁助理依各則內容整理。" })
    );
    r.replaceChildren(wrap);
    r.scrollTop = 0;
    document.body.classList.add("reading");
  }

  function sectionHash() { return state.section === "pil" ? "" : "#" + state.section; }
  function setHash(h2) { try { history.replaceState(null, "", location.pathname + location.search + h2); } catch (e) {} }

  function afterOpen(selector) {
    var el = selector ? document.querySelector(selector) : null;
    if (el && window.matchMedia("(min-width: 900px)").matches) el.scrollIntoView({ block: "nearest" });
  }
  function openItem(id) {
    var key = sectionOf(id);
    if (!key) return;
    if (key !== state.section) { switchSection(key); }
    state.openCase = "";
    state.openId = id;
    if (!readSet.has(id)) { readSet.add(id); saveSet("ild.read", readSet); }
    setHash("#" + id);
    document.body.classList.add("reading");
    renderReader(); renderList(); renderStatus(); renderSections(); renderCases();
    afterOpen('.row[data-id="' + CSS.escape(id) + '"]');
  }
  function openCase(cid) {
    var key = caseSectionOf(cid);
    if (!key) return;
    if (key !== state.section) { switchSection(key); }
    state.openId = ""; state.openCase = cid;
    setHash("#case-" + cid);
    renderReader(); renderList(); renderCases();
  }
  function closeReader() {
    var id = state.openId;
    state.openId = ""; state.openCase = "";
    setHash(sectionHash());
    renderReader(); renderList(); renderCases();
    var row = id ? document.querySelector('.row[data-id="' + CSS.escape(id) + '"]') : null;
    if (row) { row.focus(); row.scrollIntoView({ block: "nearest" }); }
  }
  function switchSection(key) {
    state.section = key; state.field = ""; state.court = ""; state.kind = ""; state.openId = ""; state.openCase = "";
    savePref("ild.section", key);
    renderAll();
  }
  function setSection(key) {
    switchSection(key);
    setHash(sectionHash());
    var tab = document.getElementById("tab-" + key); if (tab) tab.focus();
  }
  function toggleStar(id) {
    if (starSet.has(id)) starSet.delete(id); else starSet.add(id);
    saveSet("ild.star", starSet); renderReader(); renderList();
  }
  function markUnread(id) {
    readSet.delete(id); saveSet("ild.read", readSet); renderList(); renderStatus(); renderSections(); toast("已標為未讀");
  }
  function setQuery(q) {
    var input = document.getElementById("q"); input.value = q; state.q = q.trim();
    renderList(); renderGenre(); if (!window.matchMedia("(min-width: 900px)").matches) closeReader();
  }

  // ---- controls ----
  var qTimer = null;
  document.getElementById("q").addEventListener("input", function (e) {
    clearTimeout(qTimer); var v = e.target.value;
    qTimer = setTimeout(function () { state.q = v.trim(); renderList(); renderGenre(); }, 120);
  });
  document.getElementById("kind").addEventListener("change", function (e) { state.kind = e.target.value; renderList(); renderGenre(); });
  document.getElementById("unreadOnly").addEventListener("change", function (e) { state.unreadOnly = e.target.checked; renderList(); renderGenre(); });
  document.getElementById("starOnly").addEventListener("change", function (e) { state.starOnly = e.target.checked; renderList(); renderGenre(); });
  document.getElementById("markAll").addEventListener("click", function () {
    S().items.forEach(function (i) { readSet.add(i.id); }); saveSet("ild.read", readSet); renderList(); renderStatus(); renderSections(); toast("已全部標為已讀");
  });
  document.getElementById("icsAll").addEventListener("click", function () {
    var list = upcomingAgenda(state.section).filter(function (a) { return str(a.date); });
    if (list.length) downloadIcs(list, state.section);
  });
  document.getElementById("sections").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var i = SECTION_ORDER.indexOf(state.section);
    var next = SECTION_ORDER[(i + (e.key === "ArrowRight" ? 1 : SECTION_ORDER.length - 1)) % SECTION_ORDER.length];
    e.preventDefault(); setSection(next);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (state.openId || state.openCase)) closeReader();
  });

  function renderAll() {
    renderSections(); renderStatus(); renderFields(); renderCourts(); renderGenre(); renderKinds(); renderAgenda(); renderCases(); renderList();
    if (state.openId && !S().items.some(function (i) { return i.id === state.openId; })) state.openId = "";
    renderReader();
  }

  // ---- data ----
  // Pick the starting tab: a tab in the link (#arb, #week) wins, then the viewer's last choice.
  var initialHash = "";
  try { initialHash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (SECTIONS[initialHash]) state.section = initialHash;
  else if (!initialHash && SECTIONS[loadPref("ild.section")]) state.section = loadPref("ild.section");

  var hashTried = false;
  function tryHash() {
    if (hashTried) return;
    var id = initialHash;
    if (!id || SECTIONS[id]) { hashTried = true; return; }
    var pending = ITEM_SECTIONS.some(function (k) { return !data[k].loaded && !data[k].loadError; });
    if (/^case-/.test(id)) {
      var cid = id.slice(5), ck = caseSectionOf(cid);
      if (!ck && pending) return;
      hashTried = true;
      if (ck) openCase(cid);
      return;
    }
    var key = sectionOf(id);
    if (!key && pending) return; // wait until both files are in
    hashTried = true;
    if (key) openItem(id);
  }

  renderAll();

  // Content lives in data.json (國際公法), arbitration.json (國際仲裁法) and digest.json (本週重點), published alongside this page.
  function cleanList(v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === "object" && typeof x.id === "string" && x.id; }) : []; }
  SECTION_ORDER.forEach(function (key) {
    var d = data[key];
    fetch(SECTIONS[key].file, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (x) {
        d.items = cleanList(x.items);
        d.agenda = cleanList(x.agenda);
        d.cases = cleanList(x.cases);
        d.issues = cleanList(x.issues).sort(function (a, b) { return str(a.from) < str(b.from) ? 1 : -1; });
        d.meta = x.meta && typeof x.meta === "object" ? x.meta : null;
        d.archives = Array.isArray(x.archives) ? x.archives.filter(function (a) { return a && typeof a.file === "string"; }).map(function (a) { return { file: a.file, label: a.label, loaded: false }; }) : [];
        d.loaded = true;
      })
      .catch(function () { d.loadError = true; })
      .then(function () {
        if (key === state.section || (state.section === "week" && key !== "week")) renderAll(); else { renderSections(); }
        tryHash();
      });
  });
})();
</script>

</body>
</html>
