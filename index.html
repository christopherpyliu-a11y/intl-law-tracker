<style>
/* Layout: a navy masthead band (emblem, title, byline, section tabs resting on a gold rule) over a light
   reading room — filter chips, date and case strips, then a two-pane docket: entries on the left,
   a case-note reader on the right (an overlay on phones). A slim navy footer closes the page. */
:root {
  /* palette — navy for authority, charcoal for layering, gold only for rules, marks and emphasis */
  --band: #0A2540;          /* masthead and footer */
  --band-ink: #FFFFFF;
  --band-muted: #AEBBCC;
  --band-line: rgba(255, 255, 255, 0.14);
  --accent: #1B3A5F;        /* links, pressed controls */
  --accent-ink: #FFFFFF;
  --accent-soft: #EEF2F7;
  --charcoal: #2C3E50;      /* sub-headings */
  --gold: #C9A227;          /* rules and marks; too light for text on white */
  --gold-ink: #8A6A0F;      /* gold for text on light grounds */
  --paper: #F8F9FA;
  --surface: #FFFFFF;
  --ink: #1A1A1A;
  --muted: #4A5361;
  --faint: #5E6876;
  --line: #E2E6EB;
  --line-strong: #CBD2DB;
  --tint-pil: #E9EFF6;       /* overview block, 國際公法 */
  --tint-pil-line: #D3DDEA;
  --tint-arb: #F3EEE4;       /* overview block, 國際仲裁法 */
  --tint-arb-line: #E2D8C6;
  --note: #FBF6E7;
  --note-line: #E6D49C;
  --note-ink: #5C4A12;
  --shadow: 0 1px 2px rgba(10, 37, 64, 0.05);
  --shadow-hover: 0 6px 18px rgba(10, 37, 64, 0.09);
  --c-icj: #1F4E79;
  --c-icc: #7A2E3B;
  --c-ecthr: #34408A;
  --c-iacthr: #8A5A1F;
  --c-acthpr: #3D6B3A;
  --c-itlos: #1F6A73;
  --c-other: #5A6472;
  /* type — serif for headings, sans for reading, tabular figures for dates and counts */
  --f-display: "Playfair Display", "Noto Serif TC", "Songti TC", "PMingLiU", "MingLiU", serif;
  --f-body: "Source Sans 3", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --f-mono: "Source Sans 3", "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
  --s-xs: 14px; --s-sm: 15px; --s-md: 17px; --s-lg: 20px; --s-xl: 27px; --s-xxl: 32px;
  --radius: 4px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --band: #071221; --band-ink: #FFFFFF; --band-muted: #A9B6C8; --band-line: rgba(255, 255, 255, 0.10);
    --accent: #9DBBE3; --accent-ink: #0C1828; --accent-soft: #172B45;
    --charcoal: #C9D2DD; --gold: #D4AF45; --gold-ink: #D4AF45;
    --paper: #0C1828; --surface: #122238; --ink: #E7EBF0; --muted: #B7C1CE; --faint: #9DA9BA; --line: #22344C; --line-strong: #2F4562;
    --tint-pil: #0F2440; --tint-pil-line: #1E3A5E; --tint-arb: #1E2126; --tint-arb-line: #343A44;
    --note: #211D10; --note-line: #5A4B22; --note-ink: #E8D39A;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.25); --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.35);
    --c-icj: #8DB5E3; --c-icc: #E39AAA; --c-ecthr: #AEB6F0; --c-iacthr: #DDB27A; --c-acthpr: #9CCB94; --c-itlos: #7CC6CE; --c-other: #A2AEBE;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --band: #071221; --band-ink: #FFFFFF; --band-muted: #A9B6C8; --band-line: rgba(255, 255, 255, 0.10);
  --accent: #9DBBE3; --accent-ink: #0C1828; --accent-soft: #172B45;
  --charcoal: #C9D2DD; --gold: #D4AF45; --gold-ink: #D4AF45;
  --paper: #0C1828; --surface: #122238; --ink: #E7EBF0; --muted: #B7C1CE; --faint: #9DA9BA; --line: #22344C; --line-strong: #2F4562;
  --tint-pil: #0F2440; --tint-pil-line: #1E3A5E; --tint-arb: #1E2126; --tint-arb-line: #343A44;
  --note: #211D10; --note-line: #5A4B22; --note-ink: #E8D39A;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.25); --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.35);
  --c-icj: #8DB5E3; --c-icc: #E39AAA; --c-ecthr: #AEB6F0; --c-iacthr: #DDB27A; --c-acthpr: #9CCB94; --c-itlos: #7CC6CE; --c-other: #A2AEBE;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--s-md);
  line-height: 1.7;
  padding-block: 0;
  -webkit-font-smoothing: antialiased;
}
/* paints the phone's status-bar strip in the masthead colour */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap {
  max-width: 1352px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { display: grid; gap: 28px; padding-block: 28px 56px; }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums lining-nums; }
h1, h2, h3, .sec-tab, .day-head .d, .r-title, .dg-title { font-variant-numeric: lining-nums; }

/* court colour hook */
[data-court="ICJ"] { --cc: var(--c-icj); }
[data-court="ICC"] { --cc: var(--c-icc); }
[data-court="ECtHR"] { --cc: var(--c-ecthr); }
[data-court="IACtHR"] { --cc: var(--c-iacthr); }
[data-court="ACtHPR"] { --cc: var(--c-acthpr); }
[data-court="ITLOS"] { --cc: var(--c-itlos); }
[data-court="OTHER"] { --cc: var(--c-other); }
/* arbitration categories reuse the same palette */
[data-court="COURT"] { --cc: var(--c-ecthr); }
[data-court="AWARD"] { --cc: var(--c-iacthr); }
[data-court="INST"] { --cc: var(--c-itlos); }
[data-court="LAW"] { --cc: var(--c-acthpr); }
[data-court="NEWS"] { --cc: var(--c-icc); }

/* masthead band */
.mast { position: relative; overflow: hidden; background: var(--band); color: var(--band-ink); border-bottom: 2px solid var(--gold); }
.mast-art { position: absolute; right: -110px; top: -170px; width: 560px; height: 560px; color: var(--gold); opacity: 0.12; pointer-events: none; }
.mast-art.is-parallax { will-change: transform; }
.mast-inner { position: relative; display: grid; gap: 26px; padding-block: 34px 0; }
.mast-top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 40px; }
.brand { display: flex; align-items: center; gap: 18px; min-width: 0; }
.brand > div { min-width: 0; }
.emblem { flex: 0 0 auto; width: 56px; height: 56px; color: var(--gold); }
.eyebrow { font-family: var(--f-body); font-weight: 600; font-size: 12.5px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold); }
h1 { font-family: var(--f-display); font-weight: 700; font-size: var(--s-xxl); line-height: 1.2; margin: 4px 0 0; letter-spacing: 0.08em; text-wrap: balance; color: var(--band-ink); }
.byline { margin: 8px 0 0; font-size: var(--s-sm); color: var(--band-muted); overflow-wrap: anywhere; }
.byline a { color: inherit; text-decoration-color: var(--band-line); }
.byline a:hover { color: var(--band-ink); text-decoration-color: var(--gold); }
.status { font-size: var(--s-sm); color: var(--band-muted); display: flex; flex-wrap: wrap; gap: 2px 18px; max-width: 540px; }
.status b { color: var(--band-ink); font-weight: 600; }
.mast :focus-visible { outline-color: var(--gold); }

/* section tabs: 國際公法 / 國際仲裁法 / 本週重點 */
.sections { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--band-line); }
.sections::-webkit-scrollbar { display: none; }
.sec-tab {
  flex: 0 0 auto; display: inline-flex; align-items: baseline; gap: 9px;
  border: 0; background: none; cursor: pointer; padding: 13px 16px 11px;
  border-bottom: 3px solid transparent; color: var(--band-muted);
  font-family: var(--f-body); font-weight: 600; font-size: 17px; line-height: 1.3; letter-spacing: 0.04em;
}
.sec-tab:first-child { padding-left: 0; }
.sec-tab .en { display: none; }
.sec-tab .n { align-self: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 13px; letter-spacing: 0; line-height: 1.6; color: var(--band); background: var(--gold); border-radius: 999px; padding: 0 7px; }
.sec-tab:hover { color: var(--band-ink); }
.sec-tab[aria-selected="true"] { color: var(--band-ink); border-bottom-color: var(--gold); }
@media (max-width: 640px) { .sec-tab .en { display: none; } .sec-tab { font-size: var(--s-md); padding-inline: 11px; } }

/* search and filters: one bar under the section header */
.zone-filters { background: var(--surface); border-bottom: 1px solid var(--line); }
.zone-filters .zone-inner { padding-block: 18px 16px; }
.fbar { display: grid; gap: 14px; }
.ftop { display: flex; gap: 10px; align-items: center; }
.search { flex: 1 1 auto; min-width: 0; position: relative; }
.search input {
  width: 100%; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius);
  padding: 11px 14px; font-size: var(--s-md);
}
.search input:focus { border-color: var(--accent); }
.ftoggle { display: none; align-items: center; gap: 6px; flex: 0 0 auto; border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 10px 14px; font-size: var(--s-sm); font-weight: 600; cursor: pointer; }
.fpanel { display: grid; gap: 12px; }
.frow { display: flex; flex-wrap: wrap; gap: 10px 28px; }
.fgroup { display: flex; align-items: center; gap: 10px; min-width: 0; }
.flabel { flex: 0 0 auto; font-size: var(--s-xs); font-weight: 600; color: var(--muted); }
.fopts { display: flex; flex-wrap: wrap; gap: 6px; min-width: 0; }
.fpill { display: inline-flex; align-items: baseline; gap: 6px; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 13px; font-size: var(--s-sm); color: var(--ink); cursor: pointer; white-space: nowrap; }
.fpill .n { font-variant-numeric: tabular-nums; font-size: var(--s-xs); color: var(--faint); }
.fpill:hover { border-color: var(--accent); }
.fpill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.fpill[aria-pressed="true"] .n { color: var(--accent-ink); }
.fpill:disabled { opacity: 0.45; cursor: default; }
.adv { border-top: 1px dashed var(--line); padding-top: 10px; }
.adv summary { cursor: pointer; font-size: var(--s-sm); font-weight: 600; color: var(--accent); width: max-content; }
.adv-body { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-top: 12px; }
.fsel { display: inline-flex; align-items: center; gap: 8px; font-size: var(--s-xs); font-weight: 600; color: var(--muted); }
.fsel select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 6px 10px; font-size: var(--s-sm); font-weight: 400; color: var(--ink); max-width: 15em; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: var(--s-sm); color: var(--muted); cursor: pointer; }
.check input { accent-color: var(--accent); margin: 0; width: 16px; height: 16px; }
.linkish { border: 0; background: none; padding: 0; font-size: var(--s-sm); color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.active { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 20px; }
.chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; min-width: 0; }
.chips-label { font-size: var(--s-xs); color: var(--muted); margin-right: 2px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); background: var(--accent-soft); color: var(--accent); border-radius: 999px; padding: 2px 6px 2px 12px; font-size: var(--s-sm); font-weight: 600; cursor: pointer; }
.chip .x { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font-size: 15px; line-height: 1; }
.chip:hover .x { background: var(--accent); color: var(--accent-ink); }
.result { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; font-size: var(--s-xs); color: var(--muted); }
.result b { color: var(--ink); font-size: var(--s-sm); }
@media (max-width: 760px) {
  .ftoggle { display: inline-flex; }
  .fpanel { display: none; }
  .fbar.is-open .fpanel { display: grid; }
  .fgroup { display: grid; gap: 6px; width: 100%; }
}

/* sidebar: upcoming dates, case tracker, keyword cloud */
.side { display: grid; gap: 14px; align-content: start; min-width: 0; }
.side-box { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); }
.side-box > summary { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 13px 16px; cursor: pointer; list-style: none; }
.side-box > summary::-webkit-details-marker { display: none; }
.side-box > summary::after { content: "＋"; color: var(--faint); font-size: var(--s-sm); }
.side-box[open] > summary::after { content: "－"; }
.side-box[open] > summary { border-bottom: 1px solid var(--line); }
.side-h { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: 0.06em; color: var(--charcoal); }
.side-n { margin-left: auto; font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.side-list { list-style: none; margin: 0; padding: 4px 16px 8px; display: grid; }
.si { display: grid; grid-template-columns: 50px minmax(0, 1fr); gap: 10px; padding: 11px 0; border-top: 1px solid var(--line); }
.si:first-child { border-top: 0; }
.si-date { display: grid; align-content: start; line-height: 1.3; font-variant-numeric: lining-nums tabular-nums; }
.si-date b { font-size: var(--s-md); color: var(--charcoal); }
.si-date span { font-size: var(--s-xs); color: var(--muted); }
.si-date.soon b { color: var(--gold-ink); }
.si-main { display: grid; gap: 3px; min-width: 0; justify-items: start; }
.si-meta { font-size: var(--s-xs); color: var(--muted); }
.si-meta .code { color: var(--cc); font-weight: 600; letter-spacing: 0.03em; }
.si-title { font-size: var(--s-sm); font-weight: 500; line-height: 1.5; color: var(--ink); text-align: left; text-decoration: none; border: 0; background: none; padding: 0; cursor: pointer; }
span.si-title { cursor: default; }
a.si-title:hover, button.si-title:hover { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.si-note { font-size: var(--s-xs); color: var(--muted); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.si-case { grid-template-columns: minmax(0, 1fr); }
.si-btn { display: grid; gap: 3px; width: 100%; border: 0; background: none; padding: 0; text-align: left; color: var(--ink); cursor: pointer; }
.si-btn:hover .si-title { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; }
.si-case.is-open .si-title { color: var(--accent); }
.si-case.is-open { box-shadow: inset 3px 0 0 var(--accent); padding-left: 10px; }
.si-more { display: block; padding: 10px 0 4px; border-top: 1px solid var(--line); }
.side-foot { padding: 0 16px 14px; }
.ag-cal { font-size: var(--s-xs); color: var(--accent); text-decoration: none; white-space: nowrap; font-weight: 600; }
.ag-cal:hover { text-decoration: underline; }

/* list and sidebar side by side; an opened entry takes the sidebar's place */
.split { display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-items: start; }
.split > .side { order: -1; }
@media (min-width: 1060px) {
  .split { grid-template-columns: minmax(0, 1fr) 340px; gap: 30px; }
  .split > .side { order: 0; }
}
@media (min-width: 900px) {
  body.reading .split { grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 32px; }
  body.reading .split > .side { display: none; }
}

/* list: short title and one key point per entry */
.list { display: grid; gap: 30px; min-width: 0; }
.day { display: grid; gap: 10px; min-width: 0; }
.day-items { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
.day-head { display: flex; align-items: baseline; gap: 12px; }
.day-head .d { font-family: var(--f-display); font-weight: 700; font-size: 18px; letter-spacing: 0.04em; color: var(--charcoal); }
.day-head .iso { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: var(--s-xs); color: var(--muted); letter-spacing: 0.02em; }
.day-head .rule { flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }

.row {
  display: grid; gap: 5px; width: 100%; text-align: left; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
  padding: 14px 18px 15px;
}
.row:hover { border-color: var(--cc); box-shadow: var(--shadow-hover); }
.row[aria-current="true"] { border-color: var(--cc); box-shadow: inset 3px 0 0 var(--cc), var(--shadow-hover); }
.row-top { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: var(--s-xs); color: var(--muted); }
.row .code { font-family: var(--f-mono); font-weight: 700; letter-spacing: 0.03em; color: var(--cc); }
.kind { border: 1px solid var(--line-strong); border-radius: 3px; padding: 0 6px; line-height: 1.55; }
.key { color: var(--gold-ink); font-weight: 700; }
.fld { font-weight: 600; color: var(--c-ecthr); }
.fld.inv { color: var(--c-icc); }
.row-ev { color: var(--charcoal); }
.unread-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; }
.starred { color: var(--gold-ink); }
.row-title { font-weight: 500; font-size: 18px; line-height: 1.45; color: var(--ink); }
.row.is-read .row-title { color: var(--muted); font-weight: 400; }
.row-point { font-size: var(--s-sm); color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.row-sub { display: flex; flex-wrap: wrap; gap: 2px 14px; font-size: var(--s-xs); color: var(--muted); }
/* commentary is lighter than court news */
.row.is-comment { background: color-mix(in srgb, var(--surface) 45%, var(--paper)); box-shadow: none; }
.row.is-comment .row-title { font-weight: 400; }
.case-tag { color: var(--accent); font-weight: 600; }

.empty { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 24px 20px; color: var(--muted); font-size: var(--s-sm); background: var(--surface); }
.empty strong { color: var(--ink); display: block; font-size: var(--s-md); margin-bottom: 4px; font-weight: 600; }

/* reader */
.reader {
  display: none; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow);
}
@media (min-width: 900px) {
  body.reading .reader {
    display: block; position: sticky; top: max(12px, env(safe-area-inset-top, 0px));
    max-height: calc(100dvh - 24px); overflow-y: auto; overscroll-behavior: contain;
  }
}
@media (max-width: 899.98px) {
  body.reading { overflow: hidden; }
  body.reading .reader {
    display: block; position: fixed; inset: 0; z-index: 20; border: 0; border-radius: 0;
    overflow-y: auto; overscroll-behavior: contain;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
}
.r-wrap { padding: 26px 32px 32px; display: grid; gap: 26px; max-width: 780px; }
@media (max-width: 899.98px) { .r-wrap { padding: 16px 16px 36px; } }
.back { display: inline-block; justify-self: start; border: 1px solid var(--line-strong); background: var(--surface); border-radius: 999px; padding: 4px 14px; font-size: var(--s-sm); cursor: pointer; }
.back:hover { border-color: var(--accent); }
.back .d { display: none; }
@media (min-width: 900px) { .back .m { display: none; } .back .d { display: inline; } }

.r-head { display: grid; gap: 10px; border-bottom: 1px solid var(--line); padding-bottom: 20px; }
.r-court { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-size: var(--s-sm); color: var(--muted); }
.r-court .code { font-family: var(--f-mono); font-weight: 600; letter-spacing: 0.03em; color: var(--cc); background: color-mix(in srgb, var(--cc) 10%, transparent); padding: 1px 8px; border-radius: 3px; }
.r-meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: var(--s-sm); color: var(--muted); }
.r-title { font-family: var(--f-display); font-weight: 700; font-size: var(--s-xl); line-height: 1.4; letter-spacing: 0.02em; margin: 0; text-wrap: balance; }
.r-orig { margin: 0; font-family: var(--f-body); color: var(--muted); font-size: var(--s-sm); line-height: 1.6; overflow-wrap: anywhere; }
.r-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
.r-dates { margin: 4px 0 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); background: var(--paper); }
.r-dates > div { padding: 9px 14px; border-left: 1px solid var(--line); }
.r-dates > div:first-child { border-left: 0; }
.r-dates dt { font-size: var(--s-xs); color: var(--muted); font-weight: 600; }
.r-dates dd { margin: 2px 0 0; font-size: var(--s-md); font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.r-dates dd.na { font-weight: 400; color: var(--muted); font-size: var(--s-sm); }
.r-dates .dd-sub { display: block; font-size: var(--s-xs); font-weight: 400; color: var(--muted); }
@media (max-width: 560px) { .r-dates > div { border-left: 0; border-top: 1px solid var(--line); } .r-dates > div:first-child { border-top: 0; } }
.r-src { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.srcbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--accent); border-radius: var(--radius); padding: 8px 16px; font-size: var(--s-sm); font-weight: 600; color: var(--accent); background: var(--surface); text-decoration: none; }
.srcbtn.primary { background: var(--accent); color: var(--accent-ink); }
.srcbtn:hover { background: var(--accent-soft); }
.srcbtn.primary:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.btn { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 5px 13px; font-size: var(--s-sm); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn[aria-pressed="true"] { border-color: var(--gold-ink); color: var(--gold-ink); }

.r-sec { display: grid; gap: 9px; }
.r-sec h3 { margin: 0; font-family: var(--f-body); font-size: var(--s-xs); color: var(--faint); font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
.r-sec h3 > span:not(.zh) { display: none; }
.r-sec h3 .zh { font-family: var(--f-display); letter-spacing: 0.06em; font-size: 17px; color: var(--charcoal); font-weight: 700; text-transform: none; }
.r-sec p { margin: 0; max-width: 42em; }
.r-sec p + p { margin-top: 8px; }
.r-sec ul { margin: 0; padding-left: 1.3em; display: grid; gap: 7px; max-width: 42em; }
.r-sec li::marker { color: var(--gold); }
.r-sec .lead-note { list-style: none; margin-left: -1.3em; color: var(--muted); font-size: var(--s-sm); }

.tldr { background: var(--accent-soft); border-radius: var(--radius); padding: 16px 18px; }
.tldr p { font-size: 18px; line-height: 1.8; }

.note { background: var(--note); border: 1px solid var(--note-line); border-radius: var(--radius); padding: 13px 16px; color: var(--note-ink); }
.note h3, .note h3 .zh { color: var(--note-ink); }
.note p { font-size: var(--s-sm); }

.sources ul { list-style: none; padding: 0; gap: 9px; }
.src { display: grid; gap: 2px; }
.src a { font-size: var(--s-sm); line-height: 1.5; overflow-wrap: anywhere; }
.src .src-meta { display: flex; gap: 8px; align-items: center; font-size: var(--s-xs); color: var(--faint); font-family: var(--f-mono); }
.badge { font-family: var(--f-body); font-size: 13px; border-radius: 3px; padding: 0 6px; line-height: 1.6; border: 1px solid var(--line-strong); color: var(--muted); }
.badge.off { border-color: var(--accent); color: var(--accent); }

.memo { border: 1px solid var(--line); border-top: 2px solid var(--gold); border-radius: var(--radius); padding: 13px 16px; background: var(--surface); }
.memo-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.memo p { font-size: var(--s-sm); line-height: 1.9; }
.btn-sm { padding: 2px 11px; font-size: var(--s-xs); }
.case-line { margin: 0; }
.mini-tl { list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 5px; }
.mini-tl .linkish { text-align: left; text-decoration: none; color: var(--ink); line-height: 1.5; }
.mini-tl .linkish:hover { color: var(--accent); }
.timeline { list-style: none; margin: 0; padding: 0 0 0 18px !important; border-left: 1px solid var(--line-strong); display: grid; gap: 16px; }
.timeline li { position: relative; display: grid; gap: 4px; }
.timeline li::before { content: ""; position: absolute; left: -24px; top: 6px; width: 11px; height: 11px; border-radius: 50%; background: var(--cc); border: 2px solid var(--surface); }
.tl-date { font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.tl-card { display: grid; gap: 3px; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: var(--radius); padding: 9px 12px; cursor: pointer; }
.tl-card:hover { border-color: var(--cc); box-shadow: var(--shadow-hover); }
.tl-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; font-size: var(--s-xs); color: var(--muted); }
.tl-meta .code { font-family: var(--f-mono); color: var(--cc); font-weight: 600; letter-spacing: 0.03em; }
.tl-title { display: block; font-weight: 500; line-height: 1.5; }
.timeline li.is-comment .tl-title { font-weight: 400; }
.tl-tldr { font-size: var(--s-sm); color: var(--muted); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.case-ahead { list-style: none; padding: 0 !important; margin: 0; display: grid; gap: 6px; }
.case-ahead li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; font-size: var(--s-sm); }
.case-foot { font-size: var(--s-xs); color: var(--faint); margin: 0; }

/* keyword cloud (in the sidebar, closed until opened) */
.side-box .cloud { margin: 12px 14px 8px; }
.cloud { position: relative; min-height: 96px; background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.cw {
  position: absolute; left: 0; top: 0; margin: 0; padding: 0 4px; border: 0; border-radius: 3px; background: none;
  font-family: var(--f-body); font-weight: 600; line-height: 1.2; white-space: nowrap; cursor: pointer;
  font-variant-numeric: lining-nums;
}
.cw.t1 { color: var(--gold-ink); font-weight: 700; }
.cw.t2 { color: var(--accent); font-weight: 700; }
.cw.t3 { color: var(--charcoal); }
.cw.t4 { color: var(--muted); }
.cw:hover { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.cw[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); text-decoration: none; }
.cloud-empty { margin: 0; padding: 30px 18px; text-align: center; color: var(--muted); font-size: var(--s-sm); }
.cloud-note { margin: 0; padding: 0 16px 14px; font-size: var(--s-xs); color: var(--muted); line-height: 1.6; }
.digest .cloud { box-shadow: none; }

/* section header block, tinted by section: 國際公法 pale blue, 國際仲裁法 pale sand */
body { --tint: var(--tint-pil); --tint-line: var(--tint-pil-line); }
body[data-sec="arb"] { --tint: var(--tint-arb); --tint-line: var(--tint-arb-line); }
.zone-head { background: var(--tint); border-bottom: 1px solid var(--tint-line); }
.zone-head .zone-inner { padding-block: 20px 18px; }
.sec-intro { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 6px 48px; }
.sec-name { margin: 2px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 28px; line-height: 1.25; letter-spacing: 0.08em; color: var(--ink); }
.sec-scope { margin: 0; max-width: 640px; font-size: var(--s-sm); line-height: 1.7; color: var(--muted); }
@media (max-width: 640px) {
  .zone-head .zone-inner { padding-block: 14px 12px; }
  .sec-name { font-size: 23px; }
  .sec-scope { display: none; }
  .zone-filters .zone-inner { padding-block: 12px; }
}

/* print: one clean column on white — the open entry or case, the weekly issue, or the current list */
@media print {
  @page { size: A4; margin: 16mm 15mm 18mm; @bottom-right { content: counter(page) " / " counter(pages); font-size: 8pt; color: #555; } }
  html:root:not([data-never]) {
    color-scheme: light;
    --paper: #FFFFFF; --surface: #FFFFFF; --ink: #000000; --muted: #333333; --faint: #555555; --line: #BBBBBB; --line-strong: #999999;
    --accent: #1B3A5F; --accent-ink: #FFFFFF; --accent-soft: #F1F4F8; --charcoal: #1A1A1A; --gold: #B08D1E; --gold-ink: #6B520A;
    --note: #FBF6E7; --note-line: #C9B26A; --note-ink: #3D300A; --tint: #FFFFFF; --tint-line: #BBBBBB;
    --shadow: none; --shadow-hover: none;
    --c-icj: #1F4E79; --c-icc: #7A2E3B; --c-ecthr: #34408A; --c-iacthr: #8A5A1F; --c-acthpr: #3D6B3A; --c-itlos: #1F6A73; --c-other: #444444;
  }
  body { background: #FFFFFF; color: #000000; font-size: 10.5pt; line-height: 1.6; overflow: visible !important; }
  body::before { display: none; }
  .mast, .zone, .side, .foot, .toast, .back, .r-actions, .r-src, .r-nav, .reader .tags, .memo-head .btn, .ag-cal, .dg-actions, .dg-kicker select,
  .portal-cta, .list > .btn, .unread-dot, .cloud, .digest .dg-sec:has(.cloud) { display: none !important; }
  .print-head { display: grid; gap: 2pt; margin-bottom: 12pt; padding-bottom: 6pt; border-bottom: 1.5pt solid #000000; font-size: 8.5pt; color: #333333; }
  .ph-top { display: flex; justify-content: space-between; gap: 12pt; }
  .ph-site { font-family: var(--f-display); font-weight: 700; font-size: 11pt; color: #000000; letter-spacing: 0.06em; }
  .ph-view { font-weight: 600; color: #000000; }
  .ph-url { overflow-wrap: anywhere; }
  .wrap, .app { max-width: none; padding: 0; }
  .app { gap: 0; }
  .split, body.reading .split { display: block; }
  body.reading .list { display: none; }
  body.reading .reader {
    display: block !important; position: static !important; inset: auto; max-height: none !important; overflow: visible !important;
    border: 0; border-radius: 0; box-shadow: none; padding: 0 !important;
  }
  .r-wrap { padding: 0; max-width: none; gap: 12pt; }
  .r-head { padding-bottom: 10pt; }
  .r-title { font-size: 17pt; }
  .r-sec h3 { break-after: avoid; }
  .r-sec p, .r-sec ul { max-width: none; }
  .tldr, .note, .memo, .r-court .code { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .tldr, .note, .memo { break-inside: avoid; }
  .tldr p { font-size: 11pt; }
  a { color: #000000; text-decoration: none; }
  .src a::after { content: "　" attr(href); font-size: 8.5pt; color: #444444; overflow-wrap: anywhere; }
  .row, .tl-card, .dg-link, .portal, .ag, .digest, .reader { box-shadow: none !important; }
  .list { gap: 14pt; }
  .day-items, body.reading .day-items { display: block; }
  .day-head { break-after: avoid; }
  .row { break-inside: avoid; margin-bottom: 6pt; padding: 7pt 9pt; border: 0.75pt solid #BBBBBB; background: #FFFFFF !important; }
  .row-tldr, body.reading .row-tldr, .tl-tldr, .pl-title, .portal-clamp { -webkit-line-clamp: unset; display: block; overflow: visible; }
  .timeline li { break-inside: avoid; }
  .timeline li::before { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body .digest { border: 0; padding: 0; max-width: none; box-shadow: none; }
  body .dg-head { border-bottom: 1.5pt solid #000000; }
  .dg-link { break-inside: avoid; background: #FFFFFF; }
  .home-grid { display: block; }
  .portal { break-inside: avoid; margin-bottom: 10pt; border: 0.75pt solid #BBBBBB; }
}

/* home page */
.home-link { color: inherit; text-decoration: none; }
.home-link:hover { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 1px; text-underline-offset: 6px; }
.home { display: grid; gap: 26px; }
.home-lead { margin: 0; max-width: 48em; font-size: 17px; line-height: 1.95; color: var(--charcoal); }
.home-grid { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); align-items: stretch; }
.portal { display: flex; flex-direction: column; gap: 14px; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 28px 30px 26px; }
.portal-kicker { font-size: 12.5px; font-weight: 600; letter-spacing: 0.18em; text-transform: uppercase; color: var(--gold-ink); }
.portal-title { margin: -6px 0 0; font-family: var(--f-display); font-weight: 700; font-size: 30px; line-height: 1.25; letter-spacing: 0.08em; color: var(--ink); }
.portal-title button { border: 0; background: none; padding: 0; font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; text-align: left; }
.portal-title button:hover { text-decoration: underline; text-decoration-color: var(--gold); text-decoration-thickness: 1px; text-underline-offset: 7px; }
.portal-minor .portal-title { font-size: 23px; }
.portal-scope { margin: 0; font-size: var(--s-sm); line-height: 1.8; color: var(--muted); max-width: 40em; }
.portal-clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.portal-issue { margin: -4px 0 0; font-size: var(--s-sm); color: var(--charcoal); font-weight: 600; }
.portal-wait { margin: 0; font-size: var(--s-sm); color: var(--faint); }
.portal-stats { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 22px; padding-block: 12px; border-block: 1px solid var(--line); font-size: var(--s-xs); color: var(--muted); }
.pstat b { margin-right: 5px; font-family: var(--f-body); font-size: 22px; font-weight: 700; color: var(--ink); font-variant-numeric: lining-nums tabular-nums; }
.portal-sub { font-family: var(--f-display); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; color: var(--charcoal); margin-bottom: -6px; }
.portal-latest { list-style: none; margin: 0; padding: 0; display: grid; }
.portal-latest li + li { border-top: 1px solid var(--line); }
.pl-link { display: grid; grid-template-columns: 40px 52px minmax(0, 1fr); gap: 10px; align-items: baseline; width: 100%; padding: 9px 0; border: 0; background: none; text-align: left; color: var(--ink); cursor: pointer; }
.pl-link .mono { font-size: var(--s-xs); color: var(--faint); }
.pl-link .code { font-size: var(--s-xs); font-weight: 600; letter-spacing: 0.03em; color: var(--cc); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-title { font-size: var(--s-sm); line-height: 1.55; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pl-link:hover .pl-title { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.portal-cta { margin-top: auto; align-self: flex-start; display: inline-flex; align-items: center; gap: 10px; border: 1px solid var(--accent); border-radius: var(--radius); background: var(--accent); color: var(--accent-ink); padding: 9px 20px; font-size: var(--s-sm); font-weight: 600; letter-spacing: 0.06em; cursor: pointer; }
.portal-cta:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
.portal-cta-quiet { background: transparent; color: var(--accent); }
.portal-cta-quiet:hover { background: var(--accent-soft); }
.up-list { list-style: none; margin: 0; padding: 0; display: grid; }
.up-item { display: grid; grid-template-columns: 58px minmax(0, 1fr) auto; gap: 12px; align-items: baseline; padding: 10px 0; border-top: 1px solid var(--line); }
.up-item:first-child { border-top: 0; padding-top: 2px; }
.up-date { font-family: var(--f-body); font-weight: 700; font-size: 16px; color: var(--charcoal); font-variant-numeric: lining-nums tabular-nums; display: grid; line-height: 1.3; }
.up-wd { font-family: var(--f-body); font-weight: 400; font-size: var(--s-xs); color: var(--faint); }
.up-main { display: grid; gap: 2px; min-width: 0; }
.up-meta { font-size: var(--s-xs); color: var(--muted); }
.up-meta .code { color: var(--cc); font-weight: 600; letter-spacing: 0.03em; }
.up-title { font-size: var(--s-sm); line-height: 1.55; color: var(--ink); text-align: left; }
button.up-title { text-decoration: none; }
button.up-title:hover { color: var(--accent); text-decoration: underline; }
@media (max-width: 640px) {
  .portal { padding: 20px 18px; }
  .portal-title { font-size: 26px; }
  .up-item { grid-template-columns: 48px minmax(0, 1fr); }
  .up-item .ag-cal { grid-column: 2; }
  .sections { gap: 2px; }
  .sec-tab { font-size: 15px; padding-inline: 8px; gap: 6px; }
  .sec-tab .n { padding: 0 6px; font-size: 11px; }
}

/* weekly digest */
.sec-tab.is-digest { margin-left: auto; }
.digest { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 30px 34px 30px; display: grid; gap: 28px; max-width: 960px; }
.dg-head { display: grid; gap: 8px; border-bottom: 2px solid var(--gold); padding-bottom: 18px; }
.dg-kicker { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: var(--s-xs); color: var(--muted); letter-spacing: 0.04em; }
.dg-kicker select { border: 1px solid var(--line-strong); background: var(--surface); border-radius: var(--radius); padding: 2px 8px; font-size: var(--s-xs); }
.dg-title { font-family: var(--f-display); font-weight: 700; font-size: var(--s-xl); line-height: 1.35; letter-spacing: 0.04em; margin: 0; }
.dg-lead { margin: 4px 0 0; font-size: 17px; line-height: 1.85; max-width: 46em; }
.dg-body { display: grid; gap: 30px; }
.dg-sec-title { display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline; margin: 0 0 12px; font-family: var(--f-display); font-size: var(--s-lg); letter-spacing: 0.05em; color: var(--charcoal); border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.dg-sec-title .n { font-family: var(--f-mono); font-size: var(--s-xs); font-weight: 400; letter-spacing: 0; color: var(--faint); }
.dg-sum { margin: 0 0 12px; color: var(--muted); font-size: var(--s-sm); max-width: 46em; }
.dg-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.dg-link { display: grid; gap: 4px; width: 100%; text-align: left; border: 1px solid var(--line); border-left: 3px solid var(--cc, var(--accent)); background: var(--paper); border-radius: var(--radius); padding: 11px 14px; cursor: pointer; }
.dg-link:hover { border-color: var(--cc, var(--accent)); box-shadow: var(--shadow-hover); }
.dg-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; font-size: var(--s-xs); color: var(--muted); font-variant-numeric: tabular-nums; }
.dg-meta .code { font-family: var(--f-mono); font-weight: 600; letter-spacing: 0.03em; color: var(--cc); }
.dg-item-title { display: block; font-weight: 500; line-height: 1.5; }

  window.addEventListener("popstate", function () {
    var id = ""; try { id = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
    routing = true;
    try { route(id); } finally { routing = false; }
  });

  function afterOpen(selector) {
    var el = selector ? document.querySelector(selector) : null;
    if (el && window.matchMedia("(min-width: 900px)").matches) el.scrollIntoView({ block: "nearest" });
  }
  function openItem(id) {
    var key = sectionOf(id);
    if (!key) return;
    if (key !== state.section) { switchSection(key); }
    state.openCase = "";
    state.openId = id;
    if (!readSet.has(id)) { readSet.add(id); saveSet("ild.read", readSet); }
    setHash("#" + id);
    document.body.classList.add("reading");
    renderReader(); renderList(); renderStatus(); renderSections(); renderCases();
    afterOpen('.row[data-id="' + CSS.escape(id) + '"]');
  }
  function openCase(cid) {
    var key = caseSectionOf(cid);
    if (!key) return;
    if (key !== state.section) { switchSection(key); }
    state.openId = ""; state.openCase = cid;
    setHash("#case-" + cid);
    renderReader(); renderList(); renderCases();
  }
  function closeReader() {
    if (!state.openId && !state.openCase) return;
    // opened from this list a moment ago: step back in history instead of adding a new entry
    if (!routing && history.state && history.state.ild && history.state.from === sectionHash()) { history.back(); return; }
    var id = state.openId;
    state.openId = ""; state.openCase = "";
    setHash(sectionHash());
    renderReader(); renderList(); renderCases();
    var row = id ? document.querySelector('.row[data-id="' + CSS.escape(id) + '"]') : null;
    if (row) { row.focus(); row.scrollIntoView({ block: "nearest" }); }
  }
  function switchSection(key) {
    state.section = key; state.openId = ""; state.openCase = ""; state.agendaAll = state.casesAll = false;
    FILTER_DIMS.forEach(function (k) { state[k] = ""; });
    state.unreadOnly = state.starOnly = false; state.q = "";
    var qi = document.getElementById("q"); if (qi) qi.value = "";
    savePref("ild.section", key);
    renderAll();
  }
  function setSection(key) {
    switchSection(key);
    setHash(sectionHash());
    var tab = document.getElementById("tab-" + key); if (tab) tab.focus();
  }
  function toggleStar(id) {
    if (starSet.has(id)) starSet.delete(id); else starSet.add(id);
    saveSet("ild.star", starSet); renderReader(); renderList();
  }
  function markUnread(id) {
    readSet.delete(id); saveSet("ild.read", readSet); renderFilters(); renderList(); renderStatus(); renderSections(); toast("已標為未讀");
  }
  function setQuery(q) {
    var input = document.getElementById("q"); input.value = q; state.q = q.trim();
    refresh();
  }

  // ---- printing ----
  function nowTaipei() {
    try {
      var p = {}; new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Taipei", year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit", hourCycle: "h23" })
        .formatToParts(new Date()).forEach(function (x) { p[x.type] = x.value; });
      return p.year + "-" + p.month + "-" + p.day + " " + p.hour + ":" + p.minute;
    } catch (e) { return new Date().toISOString().slice(0, 16).replace("T", " "); }
  }
  function viewLabel() {
    if (state.openId) { var f = findItem(state.openId); return (f ? SECTIONS[f.sec].label : CFG().label) + "｜單則動態"; }
    if (state.openCase) return CFG().label + "｜案件時間軸";
    if (isHome()) return "首頁";
    if (isDigest()) return "本週重點";
    var parts = [CFG().label];
    FILTER_DIMS.forEach(function (d) { if (state[d]) parts.push(chipLabel(d)); });
    if (state.q) parts.push("搜尋「" + state.q + "」");
    if (state.unreadOnly) parts.push("只看未讀");
    if (state.starOnly) parts.push("只看收藏");
    return parts.join("・") + "（共 " + visible().length + " 則）";
  }
  function fillPrintHead() {
    document.getElementById("printHead").replaceChildren(
      h("div", { class: "ph-top" }, h("span", { class: "ph-site", text: SITE_NAME }), h("span", { text: "列印時間：" + nowTaipei() + "（台北）" })),
      h("div", { class: "ph-view", text: viewLabel() }),
      h("div", { class: "ph-url", text: SITE_URL + currentHash() }));
  }
  function doPrint() { fillPrintHead(); try { window.print(); } catch (e) { toast("無法開啟列印視窗"); } }
  window.addEventListener("beforeprint", fillPrintHead);
  if (CAN_PRINT) {
    var pl = document.getElementById("printList");
    pl.hidden = false;
    pl.addEventListener("click", doPrint);
  }

  // ---- masthead parallax ----
  // Only the globe line art drifts: at most 24px downward over the masthead's own height (about 1/8 of the
  // scroll), so it appears to recede. Text, tabs and scrolling itself are untouched; the art sits inside the
  // masthead's clipped box, so the masthead keeps its height. Off on phones and with reduced motion.
  (function () {
    var art = document.querySelector(".mast-art"), mast = document.querySelector(".mast");
    if (!art || !mast || !window.matchMedia || !window.requestAnimationFrame) return;
    var MAX_SHIFT = 24;
    var mq = window.matchMedia("(min-width: 641px) and (prefers-reduced-motion: no-preference)");
    var on = false, queued = false, last = -1;
    function apply() {
      queued = false;
      var h = mast.offsetHeight || 1;
      var y = Math.round(Math.max(0, Math.min(1, (window.scrollY || window.pageYOffset || 0) / h)) * MAX_SHIFT * 10) / 10;
      if (y !== last) { last = y; art.style.transform = "translate3d(0," + y + "px,0)"; }
    }
    function onScroll() { if (!queued) { queued = true; requestAnimationFrame(apply); } }
    function sync() {
      if (mq.matches && !on) {
        on = true; art.classList.add("is-parallax");
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", onScroll, { passive: true });
        onScroll();
      } else if (!mq.matches && on) {
        on = false; last = -1; art.classList.remove("is-parallax"); art.style.transform = "";
        window.removeEventListener("scroll", onScroll);
        window.removeEventListener("resize", onScroll);
      }
    }
    if (mq.addEventListener) mq.addEventListener("change", sync); else if (mq.addListener) mq.addListener(sync);
    sync();
  })();

  // ---- controls ----
  var qTimer = null;
  document.getElementById("q").addEventListener("input", function (e) {
    clearTimeout(qTimer); var v = e.target.value;
    qTimer = setTimeout(function () { state.q = v.trim(); renderFilters(); renderList(); }, 150);
  });
  document.getElementById("fOrg").addEventListener("change", function (e) { setFilter("org", e.target.value); });
  document.getElementById("fCountry").addEventListener("change", function (e) { setFilter("country", e.target.value); });
  document.getElementById("fTag").addEventListener("change", function (e) { setFilter("tag", e.target.value); });
  document.getElementById("unreadOnly").addEventListener("change", function (e) { state.unreadOnly = e.target.checked; refresh(); });
  document.getElementById("starOnly").addEventListener("change", function (e) { state.starOnly = e.target.checked; refresh(); });
  document.getElementById("markAll").addEventListener("click", function () {
    S().items.forEach(function (i) { readSet.add(i.id); }); saveSet("ild.read", readSet); refresh(); renderStatus(); renderSections(); toast("已全部標為已讀");
  });
  document.getElementById("fToggle").addEventListener("click", function () {
    var open = document.getElementById("fbar").classList.toggle("is-open");
    this.setAttribute("aria-expanded", open ? "true" : "false");
  });
  document.getElementById("homeLink").addEventListener("click", function (e) { e.preventDefault(); goSection("home"); });
  // sidebar boxes: dates and cases open on wide screens, the keyword cloud stays closed until opened
  (function () {
    var wide = window.matchMedia("(min-width: 1060px)").matches;
    document.getElementById("sideAgenda").open = wide;
    document.getElementById("sideCases").open = wide;
    document.getElementById("sideCloud").open = loadPref("ild.cloudOpen") === "1";
  })();
  document.getElementById("sideCloud").addEventListener("toggle", function () {
    savePref("ild.cloudOpen", this.open ? "1" : "");
    renderCloud();
  });
  document.getElementById("icsAll").addEventListener("click", function () {
    var list = upcomingAgenda(state.section).filter(function (a) { return str(a.date); });
    if (list.length) downloadIcs(list, state.section);
  });
  document.getElementById("sections").addEventListener("keydown", function (e) {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    var i = SECTION_ORDER.indexOf(state.section);
    var next = SECTION_ORDER[(i + (e.key === "ArrowRight" ? 1 : SECTION_ORDER.length - 1)) % SECTION_ORDER.length];
    e.preventDefault(); setSection(next);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && (state.openId || state.openCase)) closeReader();
  });

  function renderAll() {
    renderSections(); renderStatus(); renderFilters(); renderAgenda(); renderCases(); renderCloud(); renderList();
    if (state.openId && !S().items.some(function (i) { return i.id === state.openId; })) state.openId = "";
    renderReader();
  }

  // ---- data ----
  // Start on the home page unless the link names a tab (#pil, #arb, #week), an entry or a case.
  var initialHash = "";
  try { initialHash = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  if (SECTIONS[initialHash]) state.section = initialHash;

  var hashTried = false;
  function tryHash() {
    if (hashTried) return;
    var id = initialHash;
    if (!id || SECTIONS[id]) { hashTried = true; return; }
    var pending = ITEM_SECTIONS.some(function (k) { return !data[k].loaded && !data[k].loadError; });
    if (/^case-/.test(id)) {
      var cid = id.slice(5), ck = caseSectionOf(cid);
      if (!ck && pending) return;
      hashTried = true;
      if (ck) openCase(cid);
      return;
    }
    var key = sectionOf(id);
    if (!key && pending) return; // wait until both files are in
    hashTried = true;
    if (key) openItem(id);
  }

  renderAll();

  // Content lives in data.json (國際公法), arbitration.json (國際仲裁法) and digest.json (本週重點), published alongside this page.
  function cleanList(v) { return Array.isArray(v) ? v.filter(function (x) { return x && typeof x === "object" && typeof x.id === "string" && x.id; }) : []; }
  SECTION_ORDER.filter(function (key) { return SECTIONS[key].file; }).forEach(function (key) {
    var d = data[key];
    fetch(SECTIONS[key].file, { cache: "no-store" })
      .then(function (r) { if (!r.ok) throw new Error(String(r.status)); return r.json(); })
      .then(function (x) {
        d.items = cleanList(x.items);
        d.agenda = cleanList(x.agenda);
        d.cases = cleanList(x.cases);
        d.issues = cleanList(x.issues).sort(function (a, b) { return str(a.from) < str(b.from) ? 1 : -1; });
        d.meta = x.meta && typeof x.meta === "object" ? x.meta : null;
        d.archives = Array.isArray(x.archives) ? x.archives.filter(function (a) { return a && typeof a.file === "string"; }).map(function (a) { return { file: a.file, label: a.label, loaded: false }; }) : [];
        d.loaded = true;
      })
      .catch(function () { d.loadError = true; })
      .then(function () {
        if (key === state.section || state.section === "home" || (state.section === "week" && key !== "week")) renderAll(); else { renderSections(); }
        tryHash();
      });
  });
})();
</script>
